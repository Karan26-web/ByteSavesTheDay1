<!DOCTYPE html>
<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Byte Saves The Day · Energy Farm</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<!-- preload the stretch-arm asset so the first reach never flashes -->
<link rel="preload" as="image" href="assets/PreLBDScreen.png" />
<link rel="preload" as="image" href="assets/PodOpen.png" />
<link rel="preload" as="image" href="assets/PodCap.png" />
<link rel="preload" as="image" href="assets/DialoageBox1.svg" />
<link rel="preload" as="image" href="assets/DialoageBox2.svg" />

<style>
/* ============================================================
   BYTE SAVES THE DAY — ENERGY FARM
   Single-file HTML5 game. Vanilla JS + CSS.

   KEY IDEA FOR ALIGNMENT:
   Everything lives inside #board, a fixed 16:9 element that exactly
   matches Background.svg (1920x1080). The board is scaled to "cover"
   the viewport. Because the board shares the background's aspect ratio,
   percentage positions map directly onto the background's painted tiles
   — so Byte, the glow tile and the pods sit on the real path/grass cells.

   Sections: 1) Stage/Board  2) Glow tile  3) Byte  4) Pods
             5) Effects  6) UI  7) Win
   ============================================================ */

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#0d1b12;
  font-family:'Baloo 2','Comic Sans MS','Segoe UI Rounded','Nunito',system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;}

/* ---------- Stage (viewport) ---------- */
#stage{position:fixed;inset:0;width:100vw;height:100vh;overflow:hidden;background:#243018;}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:60;
  background:linear-gradient(180deg, rgba(20,40,20,.26) 0%, rgba(0,0,0,0) 16%,
             rgba(0,0,0,0) 74%, rgba(20,40,20,.28) 100%);}

/* ---------- Board: 16:9, covers the viewport, holds the background ---------- */
#board{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:max(100vw, calc(100vh * 16 / 9));
  height:max(100vh, calc(100vw * 9 / 16));
  background:url('assets/Background.svg') center center / 100% 100% no-repeat;}
#board::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  opacity:0;mix-blend-mode:soft-light;transition:opacity .45s ease, background .45s ease;}
#board.field-1::before{opacity:.28;background:linear-gradient(90deg, rgba(74,194,255,.55), rgba(146,230,70,.2));}
#board.field-2::before{opacity:.3;background:linear-gradient(90deg, rgba(255,216,76,.5), rgba(74,190,120,.25));}

.layer{position:absolute;inset:0;}
#objectLayer{z-index:20;}     /* pods (children of the board → grid-aligned) */
#effectLayer{z-index:40;pointer-events:none;}  /* arm, coins, particles (stage → screen px) */
#uiLayer{z-index:70;pointer-events:none;}

/* ============================================================
   2) GLOW TILE  (soft yellow marker on Byte's current path cell)
   ============================================================ */
/* SVG highlight: a soft rounded-SQUARE pad matching a grass tile (alpha-feathered) */
#tile{position:absolute;left:50.13%;width:6.87%;height:13.29%;z-index:15;
  transform:translate(-50%,-50%) scale(.7);opacity:0;pointer-events:none;
  transition:top .26s cubic-bezier(.34,1.5,.5,1), opacity .45s ease,
             transform .45s cubic-bezier(.34,1.5,.5,1);}
#tile svg{display:block;width:100%;height:100%;overflow:visible;}
#tile.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
#tile.show svg{animation:tileGlow 1.7s ease-in-out infinite;}
@keyframes tileGlow{0%,100%{opacity:.82}50%{opacity:1}}

/* ============================================================
   3) BYTE
   ============================================================ */
/* sized by HEIGHT so all sprites (byte/left/right) keep the same on-screen size
   even though their source aspect ratios differ */
#byte{position:absolute;left:50.13%;top:91%;height:14%;width:auto;
  transform:translate(-50%,-50%);
  transition:top 1.5s cubic-bezier(.38,.02,.28,1), left 1.5s cubic-bezier(.34,1.4,.5,1);
  z-index:25;will-change:top;}

/* No idle float/breath/shadow animation — Byte stands still on its tile. Movement
   comes only from walking (byteWalk/byteStep/walkShadow), reaching, charging, and the
   happy/landing one-shots, which are added by more-specific .walking/.happy/.landing rules. */
#byte .byte-shadow{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);
  width:66%;height:14%;border-radius:50%;z-index:0;pointer-events:none;
  background:radial-gradient(closest-side, rgba(0,0,0,.45), rgba(0,0,0,0));
  filter:blur(2px);}
#byte .byte-float{position:relative;z-index:1;height:100%;}
#byte .byte-breath{position:relative;height:100%;
  transform-origin:50% 100%;transition:transform .35s ease;}
/* --byteScale corrects for the no-hand turn sprites filling more of their frame than
   byte.png, so Byte keeps the SAME visual size when it turns (char heights match:
   byte.png fills .7115 of its frame, the no-hand sprites .9856 → .7115/.9856 ≈ .72).
   Origin = feet (stays grounded). */
#byte img{display:block;height:100%;width:auto;pointer-events:none;
  position:relative;z-index:1;
  filter:drop-shadow(0 8px 10px rgba(0,0,0,.28));
  transform:scale(var(--byteScale,1));transform-origin:50% 100%;
  transition:transform .55s cubic-bezier(.34,1.5,.5,1);}

/* WALKING — a procedural step cycle replaces the idle hover so Byte takes
   little robot steps (WALL-E / Astro Bot) instead of floating:
     .byte-float  → bob + body lean + side-to-side weight shift (byteWalk)
     .byte-breath → foot-contact squash / lift stretch          (byteStep)
     .byte-shadow → shrinks on lift, grows on land              (walkShadow)
   Overriding these animations also kills the normal float/breath. */
#byte.walking .byte-float{animation:byteWalk .45s infinite ease-in-out;transform-origin:50% 90%;}
#byte.walking .byte-breath{animation:byteStep .45s infinite ease-in-out;}
#byte.walking .byte-shadow{animation:walkShadow .45s infinite ease-in-out;}
/* landing impact as Byte settles onto its destination tile */
#byte.landing .byte-breath{animation:byteLand .18s ease-out;}
#byte.turnL img,#byte.turnR img{--byteScale:.72;}

#byte .byte-aura{position:absolute;inset:-22% -28%;border-radius:50%;
  background:radial-gradient(closest-side, rgba(90,200,255,.55), rgba(90,200,255,0) 70%);
  opacity:0;transition:opacity .25s ease;pointer-events:none;z-index:-1;}
#byte.charging .byte-aura{opacity:1;animation:auraPulse .7s ease-in-out infinite;}
#byte.happy .byte-float{animation:byteHappy .55s cubic-bezier(.34,1.5,.5,1) 2;}

@keyframes byteFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3.5%)}}
@keyframes shadowPulse{0%,100%{transform:translateX(-50%) scale(1);opacity:.85}50%{transform:translateX(-50%) scale(.86);opacity:.6}}
@keyframes byteBreath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.975)}}
/* Procedural walk: vertical bob, alternating body lean, and weight shift.
   Two foot-lifts per cycle (25% + 75%); contacts at 0/50/100%. */
@keyframes byteWalk{
  0%  {transform:translateX(-3px) translateY(0)    rotate(-2deg)}
  25% {transform:translateX(0)    translateY(-5px) rotate(2deg)}
  50% {transform:translateX(3px)  translateY(0)    rotate(2deg)}
  75% {transform:translateX(0)    translateY(-5px) rotate(-2deg)}
  100%{transform:translateX(-3px) translateY(0)    rotate(-2deg)}
}
/* Robot step squash: flatten on foot contact, stretch tall on lift (feet pivot) */
@keyframes byteStep{
  0%,50%,100%{transform:scaleX(1.03) scaleY(0.97)}
  25%,75%    {transform:scaleX(0.98) scaleY(1.03)}
}
/* Shadow reacts to the gait: big + dark on landing, small + faint on lift */
@keyframes walkShadow{
  0%,50%,100%{transform:translateX(-50%) scale(1);opacity:.85}
  25%,75%    {transform:translateX(-50%) scale(.78);opacity:.5}
}
/* Landing impact: squash wide on touchdown, tiny rebound, settle */
@keyframes byteLand{
  0%  {transform:scale(1.08,0.92)}
  55% {transform:scale(0.98,1.03)}
  100%{transform:scale(1)}
}
@keyframes byteHappy{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-22%) scale(1.06)}100%{transform:translateY(0) scale(1)}}
@keyframes auraPulse{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.12);opacity:.9}}

/* ---------- Byte's stretch ARM — cropped overlay on the no-hand turned sprite -------
   The no-hand turn sprite (Left/RightTurnByte_NoHand.png) is the body (z-index 2) with
   its reaching arm already removed; this overlay paints ONLY the arm (z-index 3),
   emerging from the empty shoulder. Three side-by-side panels of the tube asset:
     .stretch-conn   → fixed shoulder connector (a short uniform-tube segment)
     .stretch-middle → the stretching tube      — ONLY this width animates
     .stretch-cap    → fixed end cap (the hand)
   Connector and cap never stretch, so they never deform. The container is pinned at
   the shoulder and rotated/mirrored to aim the arm at the pod. */
/* Lives in #board's stacking context: z 22 sits ABOVE the pods (objectLayer z20) so the
   hand reaches in front of them, but BELOW Byte (#byte z25) so the arm root tucks behind
   the body and emerges from the shoulder seam. */
.byte-stretch{position:absolute;display:flex;align-items:center;z-index:22;
  pointer-events:none;will-change:transform;
  filter:drop-shadow(0 7px 9px rgba(0,0,0,.26));}
/* Blue shoulder JOINT — a Byte-material (cyan) cap over the seam where the stretch arm
   meets the shoulder. Sits above Byte (z26) so it reads as part of the body. Same cyan
   as Byte's hands/feet/neck. Size set in JS to match the arm thickness. */
.arm-joint{position:absolute;border-radius:50%;
  background:radial-gradient(circle at 40% 32%, #dcf7ff, #4ac9ef 60%, #1ea6cf);
  box-shadow:inset 0 1px 2px rgba(255,255,255,.8), inset 0 -2px 3px rgba(20,120,160,.45),
             0 1px 3px rgba(0,0,0,.25);
  transform:translate(-50%,-50%);z-index:26;pointer-events:none;}
.byte-stretch .stretch-conn,
.byte-stretch .stretch-middle,
.byte-stretch .stretch-cap{height:100%;flex:none;
  background-image:url("assets/ByteWithExtendedHand.svg");
  background-repeat:no-repeat;}
/* cap: full-height render of the SVG, windowed to the right (the blue hand) */
.byte-stretch .stretch-cap {background-position:right center;background-size:auto 100%;}
/* connector + middle: background-size + position are set per-frame in JS (sliceMiddle),
   both sampling the uniform tube band — the connector at a fixed width, middle animated */
.byte-stretch .stretch-conn,
.byte-stretch .stretch-middle{background-position:center;}

/* anticipation: kill the idle breath so the wind-up reads cleanly */
#byte.anticipate .byte-breath{animation:none;transition:transform .12s cubic-bezier(.3,.85,.4,1);}

/* ============================================================
   4) ENERGY PODS (capsules placed LEFT / RIGHT of the path)
   ============================================================ */
.pod{position:absolute;width:9%;aspect-ratio:430/286;
  transform:translate(-50%,-50%);z-index:18;cursor:pointer;
  transition:transform .18s ease, opacity .4s ease;}
.pod.appear{animation:podSpawn .5s cubic-bezier(.34,1.5,.5,1) both;}
.pod:active{transform:translate(-50%,-50%) scale(.93);}

/* soft alpha SVG layers sized to the full pod, not a separate ellipse */
.pod .pod-shadow,
.pod .pod-glow-svg{position:absolute;inset:0;width:100%;height:100%;z-index:0;
  pointer-events:none;overflow:visible;display:block;transform-origin:50% 50%;}
.pod .pod-shadow{opacity:.86;transform:scale(1.02);}
.pod .pod-glow-svg{inset:-14%;width:128%;height:128%;opacity:0;transform:scale(.94);
  transition:opacity .35s ease, transform .35s cubic-bezier(.34,1.5,.5,1);}
.pod.hint .pod-glow-svg,
.pod.glow .pod-glow-svg{animation:podPulseGlow 1.55s ease-in-out infinite;}
/* --flip mirrors the art so the button faces Byte (set per side + open state in JS).
   No idle bounce — the pod sits still on the grass. podPop uses `scale` so it composes
   with the `transform` flip. */
.pod .pod-img{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:contain;z-index:2;
  filter:drop-shadow(0 5px 6px rgba(0,0,0,.22));transform:scaleX(var(--flip,1));}
/* hint/glow: only the drop-shadow glow pulses — the pod body does NOT move vertically */
.pod.hint .pod-img,
.pod.glow .pod-img{animation:podImageGlow 1.55s ease-in-out infinite;}
.pod.open .pod-img{animation:podPop .55s cubic-bezier(.34,1.6,.5,1);}

/* bunny that rises out of a wrong (empty) pod — sits UPON the pod's opening.
   Sized by pod HEIGHT (not width) so it stays the same size on every pod shape. */
.pod .pod-bunny{position:absolute;left:50%;bottom:64%;width:auto;height:112%;z-index:3;
  transform-origin:50% 100%;transform:translate(-50%,55%) scale(.3);opacity:0;pointer-events:none;}
.pod.bunny-out .pod-bunny{animation:bunnyRise .7s cubic-bezier(.34,1.6,.5,1) forwards;}
@keyframes bunnyRise{0%{transform:translate(-50%,55%) scale(.35);opacity:0}
  60%{transform:translate(-50%,-6%) scale(1.05);opacity:1}100%{transform:translate(-50%,0) scale(1);opacity:1}}

/* the lid (PodCap.png) launches off the pod and flies out the top of the screen */
.pod-cap-fly{position:absolute;transform:translate(-50%,-50%);z-index:46;pointer-events:none;
  filter:drop-shadow(0 8px 10px rgba(0,0,0,.32));
  transition:top .85s cubic-bezier(.18,.6,.35,1), transform .85s cubic-bezier(.18,.6,.35,1);}

.pod .pod-flash{position:absolute;inset:4% 10% 30%;border-radius:46%;pointer-events:none;z-index:3;
  background:radial-gradient(circle, rgba(255,246,185,.95), rgba(255,230,120,0) 70%);opacity:0;}
.pod.burst .pod-flash{animation:podFlash .6s ease-out forwards;}

.pod .pod-arrow{position:absolute;top:-40%;left:50%;transform:translateX(-50%);z-index:3;
  font-size:clamp(22px,5vw,34px);color:#ffd23f;text-shadow:0 2px 4px rgba(0,0,0,.35);
  animation:arrowBob 1s ease-in-out infinite;display:none;}
.pod.hint .pod-arrow{display:block;}

@keyframes podBounce{0%,100%{translate:0 0}50%{translate:0 -6%}}
@keyframes podSpawn{0%{opacity:0;transform:translate(-50%,-30%) scale(.4)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes podHintGlow{0%,100%{box-shadow:0 0 16px 4px rgba(255,210,60,.55)}50%{box-shadow:0 0 34px 12px rgba(255,210,60,.9)}}
@keyframes podBurst{0%{box-shadow:0 0 0 0 rgba(255,240,150,.95)}100%{box-shadow:0 0 60px 30px rgba(255,240,150,0)}}
@keyframes podPop{0%{scale:1}30%{scale:1.06 .9}60%{scale:.96 1.07}100%{scale:1}}
@keyframes podFlash{0%{opacity:0;transform:scale(.6)}30%{opacity:1}100%{opacity:0;transform:scale(1.6)}}
@keyframes podPulseGlow{
  0%,100%{opacity:.7;transform:scale(.98)}
  50%{opacity:1;transform:scale(1.14)}
}
@keyframes podImageGlow{
  0%,100%{filter:drop-shadow(0 5px 6px rgba(0,0,0,.22)) drop-shadow(0 0 8px rgba(255,226,72,.45))}
  50%{filter:drop-shadow(0 5px 6px rgba(0,0,0,.22)) drop-shadow(0 0 20px rgba(255,226,72,.9))}
}
@keyframes arrowBob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(8px)}}

.pod.shake{animation:podShake .5s ease;}
@keyframes podShake{0%,100%{transform:translate(-50%,-50%) rotate(0)}
  20%{transform:translate(-54%,-50%) rotate(-6deg)}40%{transform:translate(-46%,-50%) rotate(6deg)}
  60%{transform:translate(-53%,-50%) rotate(-4deg)}80%{transform:translate(-47%,-50%) rotate(4deg)}}

/* ============================================================
   5) EFFECTS  (coin, particles, bunny) — screen-positioned
   ============================================================ */
/* energy coin = Energy.svg (glowing bolt) */
.coin{position:absolute;width:clamp(42px,8.4vw,68px);height:auto;
  transform:translate(-50%,-50%);z-index:42;pointer-events:none;
  transition:transform .72s cubic-bezier(.5,.05,.4,1), opacity .3s ease;
  filter:drop-shadow(0 0 10px rgba(255,225,90,.85));}

/* Tutorial dialogue bubbles — the DialoageBox SVG art is shown directly as an image
   (its bubble, arrow, and text are baked in). Aspect is preserved (height auto +
   object-fit:contain); only opacity + translateY animate. */
.tutorial-box{position:absolute;height:auto;object-fit:contain;z-index:50;pointer-events:none;
  opacity:0;transform:translateY(14px);
  transition:opacity .3s ease, transform .3s cubic-bezier(.34,1.5,.5,1);
  filter:drop-shadow(0 5px 9px rgba(0,0,0,.28));}
.tutorial-box.show{opacity:1;transform:translateY(0);}

.particle{position:absolute;border-radius:50%;pointer-events:none;z-index:41;
  transform:translate(-50%,-50%);will-change:transform,opacity;
  animation:particleFly var(--dur,.9s) ease-out forwards;}
@keyframes particleFly{
  0%{opacity:1;transform:translate(-50%,-50%) translate(0,0) scale(1)}
  100%{opacity:0;transform:translate(-50%,-50%) translate(var(--tx),var(--ty)) scale(.2)}}


.bunny{position:absolute;width:clamp(66px,15vw,112px);height:auto;z-index:44;pointer-events:none;
  transform:translate(-50%,40%) scale(.3);opacity:0;filter:drop-shadow(0 6px 6px rgba(0,0,0,.3));}
.bunny.show{animation:bunnyPop .8s cubic-bezier(.34,1.6,.5,1) forwards;}
.bunny.hide{animation:bunnyHide .4s ease forwards;}
@keyframes bunnyPop{0%{transform:translate(-50%,40%) scale(.3);opacity:0}
  55%{transform:translate(-50%,-58%) scale(1.12);opacity:1}75%{transform:translate(-50%,-44%) scale(.96)}
  100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes bunnyHide{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,30%) scale(.4)}}

.bubble{position:absolute;transform:translate(-50%,-50%) scale(.6);opacity:0;z-index:45;
  pointer-events:none;background:#fff;color:#2b2b2b;font-weight:700;
  padding:.5em .8em;border-radius:14px;white-space:nowrap;
  font-size:clamp(13px,3.2vw,18px);box-shadow:0 6px 14px rgba(0,0,0,.25);
  transition:transform .3s cubic-bezier(.34,1.6,.5,1), opacity .3s ease;}
.bubble::after{content:"";position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);
  border:9px solid transparent;border-top-color:#fff;border-bottom:0;}
.bubble.show{transform:translate(-50%,-50%) scale(1);opacity:1;}

/* ============================================================
   6) UI  (screen-fixed)
   ============================================================ */
#battery{display:none !important;position:absolute;top:clamp(12px,3vh,22px);left:50%;transform:translateX(-50%);
  align-items:center;gap:8px;
  background:rgba(255,255,255,.9);border-radius:999px;padding:6px 14px 6px 10px;
  box-shadow:0 5px 14px rgba(0,0,0,.2);pointer-events:none;}
#battery .cell{position:relative;width:clamp(46px,12vw,64px);height:clamp(20px,5vw,26px);
  border:3px solid #4a4a4a;border-radius:6px;background:#eef3ee;overflow:hidden;}
#battery .cell::after{content:"";position:absolute;right:-7px;top:50%;transform:translateY(-50%);
  width:5px;height:45%;background:#4a4a4a;border-radius:0 3px 3px 0;}
#battery .fill{position:absolute;inset:2px;width:15%;border-radius:3px;
  background:linear-gradient(90deg,#ff5a5a,#ff8a3d);
  transition:width .8s cubic-bezier(.4,1,.5,1), background .6s ease;}
#battery .pct{font-weight:800;color:#3a3a3a;font-size:clamp(13px,3.4vw,17px);min-width:3ch;text-align:right;}
#battery .bolt{font-size:clamp(15px,4vw,20px);}

#instruction{position:absolute;left:50%;bottom:clamp(16px,4vh,34px);transform:translateX(-50%) translateY(20px);
  width:min(86vw,560px);background:rgba(255,255,255,.96);border-radius:22px;
  padding:clamp(14px,3.5vw,22px) clamp(16px,4vw,26px);
  box-shadow:0 12px 30px rgba(0,0,0,.28), inset 0 0 0 3px rgba(120,200,235,.4);
  opacity:0;transition:opacity .45s ease, transform .45s cubic-bezier(.34,1.4,.5,1);
  pointer-events:none;}
#instruction.show{opacity:1;transform:translateX(-50%) translateY(0);}
#instruction .txt{color:#34414d;font-weight:700;line-height:1.4;
  font-size:clamp(16px,4.4vw,23px);min-height:1.4em;}
#instruction .caret{display:inline-block;width:3px;height:1.05em;background:#34b6e6;
  margin-left:2px;vertical-align:-2px;animation:blink .7s step-end infinite;}
#instruction .cont{margin-top:8px;font-size:clamp(11px,3vw,14px);color:#8aa0ad;font-weight:700;
  opacity:0;transition:opacity .3s ease;}
#instruction .cont.show{opacity:1;animation:contPulse 1.3s ease-in-out infinite;}
@keyframes blink{50%{opacity:0}}
@keyframes contPulse{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}

/* ── Energy instruction panel (staged: bulb pops → glass panel expands → text fades) ── */
#instrPanel{position:absolute;left:50%;top:clamp(44px,10vh,86px);transform:translateX(-50%);
  width:clamp(300px,60vw,720px);max-width:90vw;pointer-events:none;
  opacity:0;visibility:hidden;transition:opacity .25s ease, visibility .25s;}
#instrPanel.show{opacity:1;visibility:visible;}
/* energy bulb badge (uses Energy.svg) — pops in first with a yellow glow + pulse */
#instrPanel .ip-bulb{position:absolute;left:clamp(-12px,-1.2vw,-8px);top:50%;z-index:3;
  width:clamp(48px,10vw,66px);height:clamp(48px,10vw,66px);border-radius:50%;
  display:grid;place-items:center;
  background:radial-gradient(circle at 50% 38%, rgba(12,58,60,.96), rgba(4,28,30,.96));
  border:2px solid #25dff5;
  box-shadow:0 0 18px 4px rgba(255,210,70,.7), inset 0 0 12px rgba(255,225,120,.3), 0 4px 10px rgba(0,0,0,.35);
  transform:translateY(-50%) scale(0) rotate(-10deg);opacity:0;}
#instrPanel .ip-bulb svg{width:58%;height:58%;display:block;filter:drop-shadow(0 0 5px rgba(255,225,120,.95));}
#instrPanel.bulb-in .ip-bulb{
  animation:ipBulbPop .4s cubic-bezier(.34,1.7,.5,1) forwards, ipBulbPulse 1.7s ease-in-out .4s infinite;}
/* dark glass panel with cyan glow border; revealed left→right via clip-path */
#instrPanel .ip-body{position:relative;box-sizing:border-box;
  padding:.72em 1.1em .72em clamp(54px,11vw,76px);
  background:rgba(5,35,35,.75);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border:2px solid #25dff5;border-radius:25px;box-shadow:0 0 20px rgba(0,220,255,.5);

<script>
"use strict";
/* ============================================================
   Helpers
   ============================================================ */
const $  = (s, r=document) => r.querySelector(s);
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const rand  = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
/* CSS-style cubic-bezier(p1x,p1y,p2x,p2y) → easing function f(t∈[0,1]) (Newton-solved) */
function cubicBezier(p1x, p1y, p2x, p2y){
  const cx = 3*p1x, bx = 3*(p2x-p1x)-cx, ax = 1-cx-bx;
  const cy = 3*p1y, by = 3*(p2y-p1y)-cy, ay = 1-cy-by;
  const fx = t => ((ax*t+bx)*t+cx)*t;
  const fy = t => ((ay*t+by)*t+cy)*t;
  const dfx = t => (3*ax*t+2*bx)*t+cx;
  return x => {
    let t = x;
    for (let i=0;i<6;i++){ const e = fx(t)-x, d = dfx(t); if (Math.abs(e)<1e-4||d===0) break; t -= e/d; }
    return fy(clamp(t,0,1));
  };
}

const stage = $('#stage');
const board = $('#board');
const objectLayer = $('#objectLayer');   // child of board → percentages align to grid
const effectLayer = $('#effectLayer');   // child of stage → screen pixels

/** centre of an element in STAGE/screen pixels (used for the arm & effects) */
function centerOf(el){
  const s = stage.getBoundingClientRect();
  const r = el.getBoundingClientRect();
  return { x: r.left - s.left + r.width/2, y: r.top - s.top + r.height/2 };
}

/* ------------------------------------------------------------
   ARM crop from ByteWithExtendedHand.svg (viewBox 0 0 612 237). We use ONLY the
   arm, never the body (the turned sprite is the body):
     tube : x[179,594] (uniform beige capsule — the stretchable part)
     cap  : x[594,612] (rounded end + blue hand — fixed)
   The connector and middle panels both paint a uniform sub-band of the tube,
   scaled to any width. Because the tube has a constant cross-section, scaling it
   horizontally is invisible — no deformation of the connector or hand.
   ------------------------------------------------------------ */
const SVG_VB_W = 612, SVG_VB_H = 237;
const SVG_SAMPLE_A = 210, SVG_SAMPLE_B = 560;                    // pure-tube band
const SVG_SAMPLE_BAND = SVG_SAMPLE_B - SVG_SAMPLE_A;              // 350
const SVG_CAP_W = 18;                                            // hand-cap slice width (x594..612)
const SVG_TUBE_THICK = 29;                                       // tube band height (y101..130)
const ARM_THICK = 0.20;                                          // arm thickness ÷ turned-sprite height
const ARM_CONN_U = 30;                                           // shoulder-connector width (SVG units)
const ARM_OVERLAP = 8;                                           // px the arm root tucks back behind the shoulder edge
/* Empty-shoulder socket as a fraction of the no-hand turned sprite's box — tune to taste. */
const SHOULDER_POINTS = { right: { x: 0.78, y: 0.58 }, left: { x: 0.22, y: 0.58 } };
/** size a tube panel's background so the pure-tube band [SAMPLE_A,SAMPLE_B] fills width `mw` */
function sliceMiddle(el, mw){
  const w = Math.max(0, mw);
  const bgW = SVG_VB_W * w / SVG_SAMPLE_BAND;        // full-image width at this scale
  const bgX = -(SVG_SAMPLE_A / SVG_VB_W) * bgW;      // align SAMPLE_A to the left edge
  el.style.width = w.toFixed(2) + 'px';
  el.style.backgroundSize = bgW.toFixed(2) + 'px 100%';
  el.style.backgroundPosition = bgX.toFixed(2) + 'px center';
}

/* ------------------------------------------------------------
   PATH GEOMETRY (in BOARD %, matching Background.svg 1920x1080)
   The painted path runs down the centre; its 6 cells sit at these
   vertical centres. Byte now slides along the path instead of hopping.
   ------------------------------------------------------------ */
/* Grid derived from Background.svg (1920x1080): grass tiles 131.877×143.503.
   Column centres step ~6.6% of width; the path is the centre column. */
const PATH_X    = 50.13;                                   // path/centre column (x %)
const TILE_TOPS = [16.9, 29.5, 42.0, 54.3, 66.7, 79.0];    // grass row centres (y %)
const ENTER_FROM = 110;     // start below the board
const EXIT_TO = -14;         // leave through the top path between fields
const PLAY_TILE = TILE_TOPS[2]; // Byte's play row — SAME tile row as the pods (horizontal reach)

/* ============================================================
   AudioManager — synthesised, soft kid-friendly SFX (Web Audio API)
   ============================================================ */
class AudioManager {
  constructor(){ this.ctx=null; this.master=null; this.enabled=true; this._stepIdx=0; this._footIdx=0; }
  init(){
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { this.enabled=false; return; }
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.42;   // overall SFX volume (a touch louder)
    this.master.connect(this.ctx.destination);
  }
  resume(){ if (this.ctx && this.ctx.state==='suspended') this.ctx.resume(); }
  toggle(){ this.enabled = !this.enabled; return this.enabled; }

  _tone({ freq, dur=.2, type='sine', gain=.25, slideTo=null, when=0 }){
    if (!this.ctx) return;
    const t = this.ctx.currentTime + when;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.05);
  }
  _noise({ dur=.08, gain=.25, when=0 }){
    if (!this.ctx) return;
    const t = this.ctx.currentTime + when;
    const n = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(g); g.connect(this.master); src.start(t);
  }

  play(name){
    if (!this.enabled || !this.ctx) return;
    this.resume();
    switch(name){
      case 'slide':  // soft whoosh as Byte glides in
        this._tone({ freq:300, slideTo:520, dur:.7, type:'sine',     gain:.14 });
        this._tone({ freq:150, slideTo:260, dur:.7, type:'triangle', gain:.08 });
        break;
      case 'step': { // soft hop "boop" — cycles a gentle scale into a little tune
        const notes = [523,587,659,587,523,494];
        const f = notes[this._stepIdx++ % notes.length];
        this._tone({ freq:f,    dur:.16, type:'triangle', gain:.20 });
        this._tone({ freq:f/2,  dur:.18, type:'sine',     gain:.10 });
        this._noise({ dur:.04, gain:.06 });   // soft landing tick
        break;
      }
      case 'footstep': { // soft little robot footfall, alternating L/R pitch as Byte walks
        const base = (this._footIdx++ % 2) ? 124 : 104;   // two feet → two pitches
        this._tone({ freq:base,     slideTo:base*0.62, dur:.10, type:'sine',     gain:.15 });
        this._tone({ freq:base*2.4, dur:.045, type:'triangle', gain:.045 });   // tiny servo tick
        this._noise({ dur:.03, gain:.045 });               // soft padded contact
        break;
      }
      case 'land': // heavier footfall as Byte settles onto its tile
        this._tone({ freq:96, slideTo:60, dur:.16, type:'sine', gain:.20 });
        this._noise({ dur:.05, gain:.08 });
        break;
      case 'turn': // quick servo whir as Byte turns its body
        this._tone({ freq:540, slideTo:360, dur:.13, type:'triangle', gain:.10 });
        this._noise({ dur:.05, gain:.04 });
        break;
      case 'tap': // soft click when a pod is selected
        this._noise({ dur:.03, gain:.10 });
        this._tone({ freq:760, slideTo:1020, dur:.08, type:'square', gain:.12 });
        break;
      case 'arm': { // robotic stepper-motor "trrr" as the arm extends
        const steps = 11;
        for (let i = 0; i < steps; i++){
          this._tone({ freq: 95 + i*7, dur:.03, type:'square', gain:.07, when:i*.045 });
          this._noise({ dur:.018, gain:.04, when:i*.045 });
        }
        this._tone({ freq:160, slideTo:480, dur:.5, type:'sawtooth', gain:.05 }); // underlying whir
        break;
      }
      case 'pop':
        this._noise({ dur:.07, gain:.18 });
        this._tone({ freq:680, slideTo:1300, dur:.13, type:'sine', gain:.18 });
        break;
      case 'cap': // lid pops + whooshes off the pod and away
        this._noise({ dur:.05, gain:.17 });                                    // cork pop
        this._tone({ freq:300, slideTo:1500, dur:.45, type:'triangle', gain:.12 }); // rising whoosh
        this._tone({ freq:620, slideTo:1950, dur:.40, type:'sine', gain:.06, when:.04 });
        break;
      case 'coin':
        this._tone({ freq:988,  dur:.08, type:'square', gain:.16 });
        this._tone({ freq:1319, dur:.20, type:'square', gain:.16, when:.08 });
        break;
      case 'charge':
        [523,659,784,1047].forEach((f,i) =>
          this._tone({ freq:f, dur:.16, type:'triangle', gain:.15, when:i*.08 }));
        break;
      case 'wrong':
        this._tone({ freq:380, slideTo:120, dur:.5, type:'sawtooth', gain:.15 });
        this._tone({ freq:190, slideTo:90,  dur:.5, type:'square',   gain:.06 });
        break;
      case 'bunny': // bouncy "hehehe" giggle
        [[1000,0],[760,.12],[1100,.24],[820,.36],[1160,.48],[880,.60],[1220,.72]].forEach(([f,w]) =>
          this._tone({ freq:f, dur:.1, type:'square', gain:.11, when:w }));
        break;
      case 'win':
        [523,659,784,1047,1319].forEach((f,i) =>
          this._tone({ freq:f, dur:i===4?.5:.16, type:'triangle', gain:.17, when:i*.12 }));
        break;
    }
  }
}
const audio = new AudioManager();
/* public placeholder API (drives the AudioManager):
   playSound("slide"|"step"|"footstep"|"land"|"arm"|"charge"|"pop"|"cap"|"wrong"|"coin"|"bunny"|"win") */
function playSound(name){ audio.play(name); }

/* ============================================================
   ParticleSystem — CSS-animated, self-cleaning
   ============================================================ */
class ParticleSystem {
  constructor(layer){ this.layer = layer; }
  emit(type, x, y, count = 12){
    for (let i = 0; i < count; i++){
      const ang = rand(0, Math.PI*2), dist = rand(40, 130);
      const tx = Math.cos(ang)*dist, ty = Math.sin(ang)*dist;
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = x + 'px'; p.style.top = y + 'px';
      p.style.setProperty('--tx', tx.toFixed(1)+'px');
      p.style.setProperty('--ty', ty.toFixed(1)+'px');
      p.style.setProperty('--dur', rand(0.7,1.3).toFixed(2)+'s');
      const size = rand(6, 14);
      p.style.width = p.style.height = size+'px';
      p.style.background = (type === 'charge')
        ? 'radial-gradient(circle, #d6f4ff, #4fc3f7)'
        : 'radial-gradient(circle, #fff6c2, #ffd23f)';
      p.style.boxShadow = (type === 'charge')
        ? '0 0 8px 2px rgba(80,195,247,.8)'
        : '0 0 8px 2px rgba(255,210,60,.8)';
      p.addEventListener('animationend', () => p.remove(), { once:true });
      this.layer.appendChild(p);
    }
  }
  confetti(){
    const w = stage.clientWidth;
    for (let i=0;i<60;i++){
      const p = document.createElement('div');
      p.className='particle';
      const size = rand(7,13);
      p.style.left=rand(0,w)+'px'; p.style.top='-20px';
      p.style.width=p.style.height=size+'px';
      p.style.borderRadius= Math.random()<.5?'50%':'2px';
      const hues=['#ff5a5a','#ffd23f','#4fc3f7','#8ed94f','#c77dff'];
      p.style.background=hues[i%hues.length];
      p.style.setProperty('--tx',rand(-60,60).toFixed(0)+'px');
      p.style.setProperty('--ty',(stage.clientHeight+60).toFixed(0)+'px');
      p.style.setProperty('--dur',rand(1.6,2.8).toFixed(2)+'s');
      p.addEventListener('animationend',()=>p.remove(),{once:true});
      effectLayer.appendChild(p);
    }
  }
}

/* ============================================================
   Byte
   ============================================================ */
const BYTE_SPRITES = {
  forward: 'assets/byte.png',                   // back view — walking up the path
  left:    'assets/leftTurnByte.png',           // turned left, normal hands (scan/turn)
  right:   'assets/RightTurnByte.png',          // turned right, normal hands (scan/turn)
  // no-hand variants — swapped in ONLY during the reach, so the stretch arm
  // replaces the missing hand (same visual size, seamless swap):
  leftNoHand:  'assets/LeftTurnByte_NoHand.png',
  rightNoHand: 'assets/RightTurnByte_NoHand.png',
};
class Byte {
  constructor(el, particles){
    this.el = el; this.particles = particles; this.stretch = null; this.stretchMiddle = null;
    this.img = el.querySelector('img');
  }
  setTopPercent(p, immediate = false){
    if (!immediate){ this.el.style.top = p + '%'; return; }
    const prev = this.el.style.transition;
    this.el.style.transition = 'none';
    this.el.style.top = p + '%';
    this.el.offsetHeight;
    this.el.style.transition = prev;
  }

  /** swap the body sprite; turn sprites are scaled down to match byte.png's size */
  _face(which){
    const src = BYTE_SPRITES[which];
    if (this.img.getAttribute('src') !== src){ this.img.src = src; playSound('turn'); } // servo whir on each turn
    this.el.classList.toggle('turnL', which === 'left');
    this.el.classList.toggle('turnR', which === 'right');
  }
  faceForward(){ this._face('forward'); }
  faceLeft(){ this._face('left'); }
  faceRight(){ this._face('right'); }
  turnTo(pod){ pod.side === 'left' ? this.faceLeft() : this.faceRight(); }
  /** silently swap the (already-turned) sprite to its no-hand variant for the reach —
      same direction, same visual size, so the stretch arm can replace the hand */
  _faceReach(dir){
    this.img.src = dir > 0 ? BYTE_SPRITES.rightNoHand : BYTE_SPRITES.leftNoHand;
  }

  async scan(){
    this.faceLeft(); await sleep(950);
    this.faceRight(); await sleep(1100);
    this.faceForward(); await sleep(450);
  }

  /** Step-walk along the painted path. The position advances in discrete hops
      (~one per foot contact, every ~225ms) instead of a smooth glide, so it
      reads as walking rather than sliding — the bob + squash hide the hops. */
  async slideTo(topPercent, { duration = 1500, sound = 'slide' } = {}){
    if (sound) playSound(sound);
    const hops = Math.max(2, Math.round(duration / 225));   // sync to the .45s gait
    this.el.style.transition = `top ${duration}ms steps(${hops}, jump-end)`;
    this.el.classList.add('walking');
    this.setTopPercent(topPercent);
    // footstep SFX on each foot contact (~every 225ms, matching the walk cycle)
    const steps = setInterval(() => playSound('footstep'), 225);
    await sleep(duration);
    clearInterval(steps);
    this.el.classList.remove('walking');
    this.el.style.transition = '';
    // little landing squash + heavier footfall as Byte settles onto the tile
    this.el.classList.add('landing');
    playSound('land');
    setTimeout(() => this.el.classList.remove('landing'), 200);
  }

  /** Reach toward a target. handlePodTap already turned Byte with the NORMAL hand
      sprite; here we hold briefly, swap to the matching NO-HAND sprite, then overlay a
      cropped arm (connector + stretching tube + hand cap) from the empty shoulder.
      Sequence: (hand turn done) → 120ms → swap to no-hand → arm grows. */
  async extendArm(targetEl){
    // direction from the current (hand) turn sprite
    const ir0 = this.img.getBoundingClientRect();
    const t0  = targetEl.getBoundingClientRect();
    const dir = (t0.left + t0.width/2) < (ir0.left + ir0.width/2) ? -1 : 1;  // pod left/right

    // STEP 2-3: hold the hand-turn pose 120ms, then swap to the no-hand variant (same
    // direction, same size) so the stretch arm replaces the hand. Wait a frame so the
    // swapped sprite is laid out before we measure its empty shoulder.
    await sleep(120);
    this._faceReach(dir);
    await new Promise(r => requestAnimationFrame(r));

    // Work in BOARD coordinates: the arm is appended to #board (same stacking context as
    // Byte) so its root can sit BEHIND the body (#byte z25) while the hand stays in front
    // of the pods (objectLayer z20). See .byte-stretch z-index:22.
    const bo = board.getBoundingClientRect();
    const ir = this.img.getBoundingClientRect();   // the no-hand turned sprite's box
    const tr = targetEl.getBoundingClientRect();
    this.el.classList.toggle('reaching-left', dir < 0);
    this.el.classList.toggle('reaching-right', dir > 0);

    // STEP: empty shoulder socket of the no-hand sprite (board coords, tunable via SHOULDER_POINTS).
    const sh = dir > 0 ? SHOULDER_POINTS.right : SHOULDER_POINTS.left;
    const shoulderX = ir.left - bo.left + ir.width  * sh.x;
    const shoulderY = ir.top  - bo.top  + ir.height * sh.y;
    const tgtX = tr.left - bo.left + tr.width/2;
    const tgtY = tr.top  - bo.top  + tr.height/2;

    // --- the arm: a cropped tube overlay scaled to a natural arm thickness; the
    //     no-hand sprite stays visible underneath as the body. ---
    const armH  = ir.height * ARM_THICK;       // on-screen tube thickness
    const S     = armH / SVG_TUBE_THICK;       // SVG units → px (tube band is 29u tall)
    const fullH = SVG_VB_H * S;                // full SVG frame height (mostly transparent)
    const connW = ARM_CONN_U * S;              // fixed shoulder connector
    const capW  = SVG_CAP_W  * S;              // fixed hand cap

    // aim shoulder → pod. Mirror for a left reach via scaleX(-1) (keeps the tube's shading
    // and drop-shadow upright); rot compensates so the arm still points at the pod.
    const dx = tgtX - shoulderX, dy = tgtY - shoulderY;
    const dist0 = Math.hypot(dx, dy) || 1;
    const angle = Math.atan2(dy, dx);                 // radians
    const rot   = dir > 0 ? angle : angle + Math.PI;  // CSS: rotate(rot) scaleX(dir)
    const ux = dx / dist0, uy = dy / dist0;
    // STEP: tuck the root ARM_OVERLAP px back behind the shoulder edge to hide the seam.
    const rootX = shoulderX - ARM_OVERLAP * ux;
    const rootY = shoulderY - ARM_OVERLAP * uy;
    const reach = dist0 + ARM_OVERLAP;                // hand still lands on the pod

    // build the arm; left-center is the pivot, mirrored for a left reach.
    const arm = document.createElement('div');
    arm.className = 'byte-stretch';
    arm.style.height = fullH + 'px';
    arm.style.left = rootX + 'px';
    arm.style.top  = (rootY - fullH / 2) + 'px';
    arm.style.transformOrigin = 'left center';
    arm.style.transform = `rotate(${rot}rad) scaleX(${dir})`;
    arm.innerHTML =
      '<div class="stretch-conn"></div>' +
      '<div class="stretch-middle"></div>' +
      '<div class="stretch-cap"></div>';
    const conn = arm.children[0], middle = arm.children[1], cap = arm.children[2];
    conn.style.width = connW + 'px';
    cap.style.width  = capW  + 'px';
    sliceMiddle(conn, connW);                  // connector = fixed uniform-tube segment
    sliceMiddle(middle, 0);                    // tube starts collapsed
    board.appendChild(arm);                    // behind Byte, in front of pods
    this.stretch = arm; this.stretchMiddle = middle;
    this._stretchRot = rot; this._stretchDir = dir;   // remembered for retraction

    // blue shoulder JOINT (Byte's cyan material) capping the seam where the arm meets
    // the body — sits above Byte at the shoulder so it reads as part of the body.
    const joint = document.createElement('div');
    joint.className = 'arm-joint';
    joint.style.width = joint.style.height = (armH * 1.15) + 'px';
    joint.style.left = shoulderX + 'px'; joint.style.top = shoulderY + 'px';
    board.appendChild(joint); this._armJoint = joint;

    return new Promise(resolve => {
      playSound('arm');
      // 2,3) tube length = reach minus the fixed connector + hand cap (only the tube
      // animates 0 → target; connector & cap keep their size, so they never deform).
      const targetW = Math.max(0, reach - connW - capW);

      // 2) fast-out / slow-in stretch — cubic-bezier(.22,1,.36,1), 550ms
      const ease = cubicBezier(0.22, 1, 0.36, 1);
      const DUR = 550, start = performance.now();
      const step = (now) => {
        const t = clamp((now - start) / DUR, 0, 1);
        let w = ease(t) * targetW;
        // tiny overshoot in the last 10%: +12px then settle
        if (t > 0.9){ const k = (t - 0.9) / 0.1; w = targetW + 12 * Math.sin(Math.PI * k); }
        sliceMiddle(middle, w);
        if (t < 1) requestAnimationFrame(step);
        else { sliceMiddle(middle, targetW); resolve(); }
      };
      requestAnimationFrame(step);
    });
  }

  /** Retract: collapse the whole arm scaleX(1→0) toward the shoulder (250ms), remove
      the overlay, wait 100ms, then return to byte.png. */
  retractArm(){
    return new Promise(resolve => {
      const arm = this.stretch;
      const finish = async () => {
        if (arm) arm.remove();
        if (this._armJoint){ this._armJoint.remove(); this._armJoint = null; }
        this.stretch = null; this.stretchMiddle = null;
        this.el.classList.remove('reaching-left','reaching-right');
        await sleep(100);          // beat after the stretch arm is gone
        this.faceForward();        // return to byte.png
        resolve();
      };
      if (!arm){ finish(); return; }
      const rot = this._stretchRot || 0, dir = this._stretchDir || 1;
      const DUR = 250, start = performance.now();
      const step = now => {
        const t = clamp((now - start) / DUR, 0, 1);
        const k = 1 - t * t;       // ease-in collapse back into the shoulder
        arm.style.transform = `rotate(${rot}rad) scaleX(${dir * k})`;
        if (t < 1) requestAnimationFrame(step);
        else finish();
      };
      requestAnimationFrame(step);
    });
  }

  startCharge(){ this.el.classList.add('charging'); }
  stopCharge(){ this.el.classList.remove('charging'); }
  cheer(){ this.el.classList.add('happy'); setTimeout(()=>this.el.classList.remove('happy'),1200); }
}

/* each field uses its own pod artwork (closed + open), matching the LBD flow */
const POD_ART_DEFAULT = { closed: 'assets/Pod.png', open: 'assets/PodOpen.png' };

class EnergyPod {
  constructor({ leftPct, topPct, hasEnergy, hint, side = 'left', art = POD_ART_DEFAULT }){
    this.hasEnergy = hasEnergy;
    this.side = side;
    this.art = art;
    this.el = document.createElement('div');
    this.el.className = 'pod appear' + (hint ? ' hint' : '');
    this.el.style.left = leftPct + '%';
    this.el.style.top  = topPct + '%';
    // each field's pod art has its own aspect ratio — size the box to it so the
    // capsule fills the box (no letterboxing) and matches the upright pods in the flow
    if (art.ratio) this.el.style.aspectRatio = art.ratio;
    if (art.width) this.el.style.width = art.width + '%';
    const uid = 'pod' + (EnergyPod._n++);     // unique ids so SVG filters don't collide
    this.el.innerHTML = `
      <div class="pod-arrow">⬇</div>
      <svg class="pod-shadow" viewBox="0 0 430 286" preserveAspectRatio="none">
        <defs>
          <radialGradient id="${uid}sg" cx="50%" cy="62%" r="58%">
            <stop offset="0%" stop-color="#10200b" stop-opacity="0.28"/>
            <stop offset="64%" stop-color="#10200b" stop-opacity="0.13"/>
            <stop offset="100%" stop-color="#10200b" stop-opacity="0"/>
          </radialGradient>
          <filter id="${uid}sb" x="-18%" y="-18%" width="136%" height="136%">
            <feGaussianBlur stdDeviation="8"/>
          </filter>
        </defs>
        <path d="M88 64C88 32 122 16 215 16C308 16 342 32 342 64V208C342 244 305 268 215 268C125 268 88 244 88 208Z"
              fill="url(#${uid}sg)" filter="url(#${uid}sb)"/>
      </svg>
      <svg class="pod-glow-svg" viewBox="0 0 430 286" preserveAspectRatio="none">
        <defs>
          <radialGradient id="${uid}gg" cx="50%" cy="48%" r="57%">
            <stop offset="0%" stop-color="#fff9b8" stop-opacity="1"/>
            <stop offset="58%" stop-color="#ffd23f" stop-opacity="0.68"/>
            <stop offset="100%" stop-color="#ffd23f" stop-opacity="0"/>
          </radialGradient>
          <filter id="${uid}gb" x="-22%" y="-22%" width="144%" height="144%">
            <feGaussianBlur stdDeviation="12"/>
          </filter>
          <filter id="${uid}gr" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3"/>
          </filter>
        </defs>
        <path d="M78 54C78 22 118 5 215 5C312 5 352 22 352 54V216C352 256 310 281 215 281C120 281 78 256 78 216Z"
              fill="url(#${uid}gg)" filter="url(#${uid}gb)"/>
        <path d="M78 54C78 22 118 5 215 5C312 5 352 22 352 54V216C352 256 310 281 215 281C120 281 78 256 78 216Z"
              fill="none" stroke="#ffe86a" stroke-opacity="0.55" stroke-width="12" filter="url(#${uid}gr)"/>
      </svg>
      <img class="pod-bunny" src="assets/BunnyChar.png" alt="" draggable="false" />
      <img class="pod-img" src="${art.closed}" alt="Energy pod" draggable="false" />
      <div class="pod-flash"></div>`;
    this.img = this.el.querySelector('.pod-img');
    this._setFacing(false);               // closed art faces Byte
    objectLayer.appendChild(this.el);     // board child → grid-aligned
  }
  enableTap(handler){ this._h = () => handler(this); this.el.addEventListener('click', this._h); }
  disableTap(){ if (this._h) this.el.removeEventListener('click', this._h); }

  /** Face the red button toward the centre path (Byte) — left pod points right (+x),
      right pod points left (-x) — and keep it consistent in BOTH closed and open states
      so it never flips when the lid pops. Pod.png's button is +x, PodOpen.png's is -x. */
  _setFacing(open){
    const desired = this.side === 'left' ? 1 : -1;   // +x for left pod, -x for right pod
    const artDir  = open ? -1 : 1;                    // natural button x-dir of the shown art
    this.img.style.setProperty('--flip', desired * artDir);   // mirror only the .pod-img
  }

  /** lid pops off: swap closed → open art, and launch the cap off the screen */
  open(){
    playSound('cap');
    this._setFacing(true);                // keep the button facing Byte in the open art
    this.img.src = this.art.open;
    this.el.classList.add('open','burst');
    this._flyCap();
  }

  /** the red lid (PodCap.png) shoots up off the pod and out the top of the screen */
  _flyCap(){
    const c = centerOf(this.el);
    const cap = document.createElement('img');
    cap.className = 'pod-cap-fly';
    cap.src = 'assets/PodCap.png'; cap.draggable = false;
    cap.style.width = (this.el.clientWidth * 0.82) + 'px';
    cap.style.left  = c.x + 'px';
    cap.style.top   = (c.y - this.el.clientHeight * 0.42) + 'px';   // sit on the lid
    effectLayer.appendChild(cap);
    const dir  = this.side === 'left' ? -1 : 1;        // drift outward, away from Byte
    const dx   = dir * (40 + Math.random() * 40);
    const spin = dir * (220 + Math.random() * 160);
    requestAnimationFrame(() => {
      cap.style.top = (-this.el.clientHeight * 1.8) + 'px';         // fly off the top
      cap.style.transform = `translate(calc(-50% + ${dx}px), -50%) rotate(${spin}deg) scale(.6)`;
    });
    setTimeout(() => cap.remove(), 950);
  }

  shake(){ this.el.classList.add('shake'); setTimeout(()=>this.el.classList.remove('shake'),520); }

  /** wrong pod: a bunny rises out of the open pod, laughing */
  async bunnyGag(){
    playSound('bunny');
    this.el.classList.add('bunny-out');
    const c = centerOf(this.el);
    const bubble = document.createElement('div');
    bubble.className = 'bubble'; bubble.textContent = 'Hehehe! No energy here!';
    bubble.style.left = c.x + 'px';
    bubble.style.top  = (c.y - this.el.clientHeight*1.05) + 'px';
    effectLayer.appendChild(bubble);
    await sleep(500); bubble.classList.add('show');
    await sleep(1500);
    bubble.classList.remove('show');
    await sleep(350); bubble.remove();
  }

  /** put the lid back & hide the bunny */
  reset(){
    this.el.classList.remove('open','burst','bunny-out');
    this.img.src = this.art.closed;
  }
  destroy(){ this.disableTap(); this.el.remove(); }
}
EnergyPod._n = 0;

/* ============================================================
   UIManager
   ============================================================ */
class UIManager {
  constructor(){
    this.instr   = $('#instruction');
    this.instrTxt= $('.txt', this.instr);
    this.cont    = $('.cont', this.instr);
    this.instrPanel = $('#instrPanel');
    this.ipText  = $('.ip-text', this.instrPanel);
    this.bigMsg  = $('#bigMsg');
    this.welcome = $('#welcomeScene');
    this.fieldCurtain = $('#fieldCurtain');
    this.battery = { fill: $('#battery .fill'), pct: $('#battery .pct') };
    this.tapCatcher = $('#tapCatcher');
    this.tile = $('#tile');
    this._battery = 15;
    this.setBattery(15, false);
  }
  async showText(text, { wait = true } = {}){
    this.instr.classList.add('show');
    this.cont.classList.remove('show');
    this.instrTxt.textContent = '';
    const caret = document.createElement('span'); caret.className = 'caret';
    this.instrTxt.appendChild(caret);
    for (let i = 0; i < text.length; i++){
      caret.insertAdjacentText('beforebegin', text[i]);
      await sleep(text[i] === ' ' ? 18 : 34);
    }
    caret.remove();
    if (wait){ this.cont.classList.add('show'); await this.waitForTap(); this.cont.classList.remove('show'); }
  }
  hideInstruction(){ this.instr.classList.remove('show'); }
  waitForTap(){
    return new Promise(resolve => {
      this.tapCatcher.classList.add('on');
      const done = () => { this.tapCatcher.classList.remove('on');
        this.tapCatcher.removeEventListener('click', done); resolve(); };
      this.tapCatcher.addEventListener('click', done);
    });
  }
  /** Show a pre-made DialoageBox image near a pod (arrow points at the pod), wait for a
      tap, then dismiss. left → DialoageBox1 (tail top-left), right → DialoageBox2 (tail
      top-right). Image only — bubble/arrow/text are baked into the asset. */
  async showDialogue(podEl, side){
    const cfg = side === 'left'
      ? { src: 'assets/DialoageBox1.svg', tailX: 0.205 }   // tail tip ≈ 20% from box left
      : { src: 'assets/DialoageBox2.svg', tailX: 0.855 };  // tail tip ≈ 85% from box left
    const img = document.createElement('img');
    img.className = 'tutorial-box'; img.src = cfg.src; img.alt = ''; img.draggable = false;
    const boxW = stage.clientWidth * 0.20;
    img.style.width = boxW + 'px';
    effectLayer.appendChild(img);
    // place the box just below the pod so its tail tip sits under the pod centre
    const s = stage.getBoundingClientRect(), pr = podEl.getBoundingClientRect();
    const podCx = pr.left - s.left + pr.width / 2;
    const podBottom = pr.bottom - s.top;
    img.style.left = (podCx - cfg.tailX * boxW) + 'px';
    img.style.top  = (podBottom + stage.clientHeight * 0.012) + 'px';
    requestAnimationFrame(() => img.classList.add('show'));   // opacity 0→1, translateY
    await this.waitForTap();
    img.classList.remove('show');
    await sleep(260);
    img.remove();
  }
  /** Big, playful "Welcome to the Energy Farm!" title — pops in, waits for a tap, fades. */
  async showWelcome(){
    this._spawnWelcomeSpecks();  // drifting cyan/yellow energy specks
    this.welcome.classList.add('show');
    await sleep(700);            // let the title bounce in before accepting a tap
    await this.waitForTap();     // welcomeScene is pointer-events:none → tapCatcher gets the tap
    this.welcome.classList.remove('show');
    await sleep(450);
    this.welcome.querySelectorAll('.welcome-particle').forEach(p => p.remove());
  }
  _spawnWelcomeSpecks(){
    this.welcome.querySelectorAll('.welcome-particle').forEach(p => p.remove());
    const cols = ['#5fe0ff', '#FFE14D', '#9ff0ff', '#FFE14D'];  // subtle cyan + energy yellow
    for (let i = 0; i < 13; i++){
      const p = document.createElement('div'); p.className = 'welcome-particle';
      const sz = 3 + Math.random() * 5, c = cols[i % cols.length];
      p.style.width = p.style.height = sz + 'px';
      p.style.background = c;
      p.style.opacity = .55;
      p.style.boxShadow = `0 0 ${sz * 1.6}px ${sz * 0.4}px ${c}`;
      p.style.left = (18 + Math.random() * 64) + '%';
      p.style.top  = (42 + Math.random() * 30) + '%';
      p.style.animationDuration = (5 + Math.random() * 4) + 's';   // slow upward drift
      p.style.animationDelay = (Math.random() * 3.5) + 's';
      this.welcome.appendChild(p);
    }
  }
  /** Staged energy panel: bulb pops → glass panel expands → text fades in. Non-blocking. */
  showHint(text){
    clearTimeout(this._ipT1); clearTimeout(this._ipT2);
    if (!text){ this.hideHint(); return; }
    const p = this.instrPanel;
    this.ipText.textContent = text;   // plain white text (no coloured keywords)
    p.classList.add('show');
    if (p.classList.contains('panel-open')){            // retry: panel already open, just replay text
      p.classList.remove('text-in'); void this.ipText.offsetWidth; p.classList.add('text-in');
      return;
    }
    requestAnimationFrame(() => {
      p.classList.add('bulb-in');                       // 1. bulb pops in
      this._ipT1 = setTimeout(() => p.classList.add('panel-open'), 420);  // 2. panel expands
      this._ipT2 = setTimeout(() => p.classList.add('text-in'),   920);   // 3. text fades up
    });
  }
  hideHint(){
    clearTimeout(this._ipT1); clearTimeout(this._ipT2);
    this.instrPanel.classList.remove('show','bulb-in','panel-open','text-in');
  }
  async bigMessage(text, ms = 1600){
    this.bigMsg.textContent = text; this.bigMsg.classList.add('show');
    await sleep(ms); this.bigMsg.classList.remove('show'); await sleep(350);
  }
  async fieldTransition(label, onCover){
    this.fieldCurtain.textContent = label;
    this.fieldCurtain.classList.remove('hide-up');
    this.fieldCurtain.classList.add('show');
    await sleep(720);
    if (onCover) onCover();          // curtain fully covers the screen → safe to swap the farm
    this.fieldCurtain.classList.add('hide-up');
    await sleep(650);
    this.fieldCurtain.classList.remove('show','hide-up');
  }
  /** glow tile follows Byte's current path cell (board %) */
  moveTile(topPercent){ this.tile.style.top = topPercent + '%'; this.tile.classList.add('show'); }
  hideTile(){ this.tile.classList.remove('show'); }
  setBattery(pct, animate = true){
    if (!this.battery.fill || !this.battery.pct) return;
    this._battery = clamp(pct, 0, 100);
    const f = this.battery.fill;
    if (!animate) f.style.transition = 'none';
    f.style.width = this._battery + '%';
    if (!animate) requestAnimationFrame(() => f.style.transition = '');
    this.battery.pct.textContent = Math.round(this._battery) + '%';
    f.style.background = this._battery < 35
      ? 'linear-gradient(90deg,#ff5a5a,#ff8a3d)'
      : this._battery < 70
        ? 'linear-gradient(90deg,#ffb13d,#ffe14d)'
        : 'linear-gradient(90deg,#7ee04d,#39c44a)';
  }
}

/* ============================================================
   GameManager — flow & state machine
   ============================================================ */
/* Pods sit on grass tile columns out from the centre path (grass column step ≈ 6.52% of
   board width; the path is PATH_X). Distances are intentionally ASYMMETRIC: the left pod
   is nearer (3rd tile), the right pod stays on the 5th tile. */
const COL_STEP = 6.52;                        // grass column width (board %)
const LEFT_OFFSET  = 3;                        // left pod  → 3rd grass tile from centre
const RIGHT_OFFSET = 5;                        // right pod → 5th grass tile from centre (unchanged)
const LEFT_X  = PATH_X - LEFT_OFFSET  * COL_STEP;   // ≈ 30.57 (3rd tile)
const RIGHT_X = PATH_X + RIGHT_OFFSET * COL_STEP;   // ≈ 82.73 (5th tile, unchanged)
/* Pods share Byte's tile row (PLAY_TILE) so the stretch arm travels straight across. */
const POD_ROW_Y = PLAY_TILE;                  // same row as Byte → horizontal reach

/* Near/Far puzzle levels (user Levels 2-9). Each: a farm background SVG plus the left &
   right pod distances FROM BYTE, in grass tiles (pod X = pathwayX ± COL_STEP·distance).
   `pathwayX` is the board-% X of that background's VERTICAL DIRT PATHWAY — Byte stands on
   it and it anchors all pod placement. These were measured once from each SVG (the runtime
   pixel-scan can't run from file:// — tainted-canvas — so the anchors are baked in here).
   Distances are intentionally asymmetric — that's what the near/far instruction tests. */
const LEVEL_CONFIG = {
  2: { background: 'Background1.svg', pathwayX: 30.10, leftDistance: 1, rightDistance: 6 },
  3: { background: 'Background2.svg', pathwayX: 69.48, leftDistance: 2, rightDistance: 5 },
  4: { background: 'Background3.svg', pathwayX: 43.23, leftDistance: 3, rightDistance: 4 },
  5: { background: 'Background4.svg', pathwayX: 50.10, leftDistance: 5, rightDistance: 3 },
  6: { background: 'Background5.svg', pathwayX: 36.56, leftDistance: 4, rightDistance: 1 },
  7: { background: 'Background6.svg', pathwayX: 63.02, leftDistance: 5, rightDistance: 2 },
  8: { background: 'Background7.svg', pathwayX: 17.19, leftDistance: 1, rightDistance: 5 },
  9: { background: 'Background8.svg', pathwayX: 23.65, leftDistance: 2, rightDistance: 4 },
};

const POD_EDGE = 7;   // keep pods at least this % in from the board edges (stay tappable)

class GameManager {
  constructor(){
    this.particles = new ParticleSystem(effectLayer);
    this.ui   = new UIManager();
    this.byte = new Byte($('#byte'), this.particles);
    this.pods = [];
    this.busy = false;
    this.canTap = false;

    /* Level 0 = the tutorial (unchanged). Levels 1-8 are the Near/Far puzzle levels
       (user Levels 2-9), generated from LEVEL_CONFIG: each is a `puzzle` with its own
       farm background and left/right pod distances. */
    this.levels = [
      // Level 1 (tutorial): the LEFT pod is the near one and holds the cell, so the
      // pod-choice shows the "near" instruction to introduce the Near/Far idea.
      { byteTop: PLAY_TILE, hint:false,
        layout:[{side:'left',energy:true},{side:'right',energy:false}],
        hintText:'The pod near Byte has a cell. Tap on the pod near Byte.' },
    ];
    for (let n = 2; n <= 9; n++){
      const c = LEVEL_CONFIG[n];
      this.levels.push({ byteTop: PLAY_TILE, puzzle:true, background: c.background,
        pathwayX: c.pathwayX, leftDistance: c.leftDistance, rightDistance: c.rightDistance });
    }
    this.level = 0;
    this._instructionType = 'near';
    this._pathX = PATH_X;        // the current level's dirt-pathway column (board %)
    // preload the farm backgrounds so the per-level swap is instant (no flash)
    for (let n = 2; n <= 9; n++){ const im = new Image(); im.src = `assets/${LEVEL_CONFIG[n].background}`; }

    $('#replayBtn').addEventListener('click', () => this.restart());
    const sndBtn = $('#sndBtn');
    sndBtn.addEventListener('click', () => {
      const on = audio.toggle();
      sndBtn.textContent = on ? '🔊' : '🔇';
      if (on) audio.play('coin');
    });
    stage.addEventListener('pointerdown', () => audio.resume(), { passive:true });
  }

  async start(){
    this.setField(0);
    this.ui.hideHint();
    this.ui.hideTile();
    this.byte.faceForward();
    this._pathX = PATH_X; this._placeByteColumn(PATH_X);   // tutorial: centre pathway
    this.byte.setTopPercent(ENTER_FROM, true);
    await sleep(200);
    await this.byte.slideTo(this.levels[0].byteTop, { duration: 3400 });
    this.ui.moveTile(this.levels[0].byteTop);
    await sleep(150);

    await this.runIntro();
    await this.beginLevel();
  }

  setField(index){
    board.classList.remove('field-1','field-2');   // no colour tint on the puzzle farms
    const cfg = this.levels[index];
    // Puzzle levels swap the farm SVG; the tutorial uses the CSS default (Background.svg).
    // Only the background-image changes — CSS keeps size (100% 100%) + centre, so the
    // 1920×1080 SVGs cover the board responsively with no distortion.
    board.style.backgroundImage = (cfg && cfg.puzzle) ? `url('assets/${cfg.background}')` : '';
  }

  /** The current level's vertical-pathway column (board %). Tutorial uses the centre path
      (PATH_X); each puzzle level uses its background's baked-in pathwayX anchor. */
  _resolvePathX(){
    const cfg = this.levels[this.level];
    this._pathX = (cfg && cfg.puzzle && cfg.pathwayX != null) ? cfg.pathwayX : PATH_X;
    return this._pathX;
  }

  /** Put Byte (and its glow tile) on a given pathway column, so Byte stands ON the path
      and walks straight up it. x is a board %. */
  _placeByteColumn(x){
    this.byte.el.style.left = x + '%';
    this.ui.tile.style.left = x + '%';
  }

  async runIntro(){
    await this.ui.showWelcome();                 // big playful "Welcome to the Energy Farm!" title
    this.spawnPods(this.levels[0], false);      // pods appear for the intro
    const left  = this.pods.find(p => p.side === 'left');
    const right = this.pods.find(p => p.side === 'right');
    // Scene 2 → glow + DialoageBox1 on the LEFT pod only
    left.el.classList.add('glow');
    await this.ui.showDialogue(left.el, 'left');
    left.el.classList.remove('glow');
    // Scene 3 → glow + DialoageBox2 on the RIGHT pod only
    right.el.classList.add('glow');
    await this.ui.showDialogue(right.el, 'right');
    right.el.classList.remove('glow');
    await sleep(300);
  }

  _x(side){ return side === 'left' ? LEFT_X : RIGHT_X; }

  spawnPods(cfg, withHint = true){
    this.pods.forEach(p => p.destroy()); this.pods = [];

    if (cfg.puzzle){
      // Tile-based placement FROM THE PATHWAY COLUMN: podX = pathX ± tile·distance.
      // (this._pathX is this background's baked pathway anchor — same column Byte stands on.)
      // Clamp to the board so a far pod stays on-screen/tappable.
      const px = this._pathX;
      const leftX  = clamp(px - cfg.leftDistance  * COL_STEP, POD_EDGE, 100 - POD_EDGE);
      const rightX = clamp(px + cfg.rightDistance * COL_STEP, POD_EDGE, 100 - POD_EDGE);
      // Energy goes in the near or far pod per the chosen instruction & the TILE distances.
      const leftIsNear   = cfg.leftDistance <= cfg.rightDistance;
      const energyOnLeft = (this._instructionType === 'near') === leftIsNear;
      this.pods.push(new EnergyPod({ leftPct: leftX,  topPct: POD_ROW_Y, hasEnergy: energyOnLeft,  hint:false, side:'left'  }));
      this.pods.push(new EnergyPod({ leftPct: rightX, topPct: POD_ROW_Y, hasEnergy: !energyOnLeft, hint:false, side:'right' }));
      return;
    }

    let layout = cfg.layout.map(o => ({ ...o }));
    if (cfg.random){
      const idx = Math.random() < 0.5 ? 0 : 1;
      layout.forEach((o,i) => o.energy = (i === idx));
    }
    layout.forEach(o => {
      const pod = new EnergyPod({
        leftPct: this._x(o.side), topPct: POD_ROW_Y,   // mid-field tile row, above Byte
        hasEnergy: o.energy, hint: withHint && cfg.hint && o.energy,
        side: o.side, art: cfg.art || POD_ART_DEFAULT,
      });
      this.pods.push(pod);
    });
  }

  /** Instruction / hint text for the current level (Near/Far directive for puzzles). */
  _levelHintText(){
    const cfg = this.levels[this.level];
    if (cfg && cfg.puzzle){
      return this._instructionType === 'near'
        ? 'The pod near Byte has a cell. Tap on the pod near Byte.'
        : 'The pod far from Byte has a cell. Tap on the pod far from Byte.';
    }
    return cfg ? (cfg.hintText || '') : '';
  }

  async beginLevel(){
    const cfg = this.levels[this.level];
    this.setField(this.level);
    this._resolvePathX();                    // pathway column for this background
    this._placeByteColumn(this._pathX);      // Byte stands ON the pathway
    // Puzzle levels: randomly test "near" or "far" — this decides which pod holds energy.
    if (cfg.puzzle) this._instructionType = Math.random() < 0.5 ? 'near' : 'far';
    this.spawnPods(cfg, true);               // pods placed left/right of the pathway
    this.ui.moveTile(cfg.byteTop);
    this.ui.showHint(this._levelHintText());
    await this.byte.scan();
    this.pods.forEach(p => p.enableTap(pod => this.handlePodTap(pod)));
    this.canTap = true;
  }

  async handlePodTap(pod){
    if (this.busy || !this.canTap) return;
    playSound('tap');                       // click feedback the moment a pod is selected
    this.busy = true; this.canTap = false;
    this.pods.forEach(p => p.disableTap());
    this.ui.hideHint();
    this.byte.turnTo(pod);                   // turn toward the pod being checked (with servo whir)
    await this.byte.extendArm(pod.el);
    await sleep(120);
    if (pod.hasEnergy) await this.correctSequence(pod);
    else               await this.wrongSequence(pod);
  }

  async correctSequence(pod){
    pod.open();                                   // lid pops off
    const podC = centerOf(pod.el);
    const openY = podC.y - pod.el.clientHeight * 0.22;   // the pod's opening (top)
    this.particles.emit('energy', podC.x, openY, 16);
    await sleep(260);

    // the energy cell rises out of the open pod, GROWING as it emerges
    playSound('coin');
    const coin = document.createElement('img');
    coin.className = 'coin'; coin.src = 'assets/Energy.svg'; coin.draggable = false;
    coin.style.left = podC.x + 'px'; coin.style.top = openY + 'px';
    coin.style.opacity = '0';
    coin.style.transform = 'translate(-50%,-50%) translateY(34%) scale(.14)';  // small, in the mouth
    effectLayer.appendChild(coin);

    await sleep(40);
    // emerge: rise up + scale up smoothly, with the energy visibly growing out of the pod
    coin.style.transition = 'transform .72s cubic-bezier(.2,.92,.22,1), opacity .18s ease';
    coin.style.opacity = '1';
    coin.style.transform = 'translate(-50%,-50%) translateY(-56%) scale(1.72)';
    await sleep(760);                             // let it rise, grow, and hover

    await this.byte.retractArm();
    // ...then floats to Byte (stays large)
    const byteC = centerOf(this.byte.el);
    coin.style.transition = 'transform .72s cubic-bezier(.5,.05,.4,1), opacity .3s ease';
    coin.style.transform =
      `translate(-50%,-50%) translate(${byteC.x - podC.x}px, ${byteC.y - openY}px) scale(1.32)`;
    await sleep(720);

    playSound('charge');
    this.byte.startCharge();
    this.particles.emit('charge', byteC.x, byteC.y, 20);
    coin.style.opacity = '0'; coin.style.transform += ' scale(.2)';
    setTimeout(() => coin.remove(), 320);

    this.byte.cheer();
    await sleep(700);
    this.byte.stopCharge(); this.byte.faceForward();

    this.level++;
    if (this.level >= this.levels.length) await this.win();
    else await this.advanceLevel();
    this.busy = false;
  }

  async wrongSequence(pod){
    playSound('wrong');
    pod.open();
    await sleep(200);
    pod.shake();
    await pod.bunnyGag();
    await this.byte.retractArm();
    this.byte.faceForward();
    pod.reset();
    await sleep(200);
    this.ui.showHint(this._levelHintText());   // re-show the same instruction for the retry
    this.pods.forEach(p => p.enableTap(pp => this.handlePodTap(pp)));
    this.canTap = true; this.busy = false;
  }

  async advanceLevel(){
    this.pods.forEach(p => { p.el.style.opacity='0';
      p.el.style.transform='translate(-50%,-30%) scale(.6)'; });
    await sleep(420);

    this.ui.hideHint();
    this.ui.hideTile();
    this.byte.faceForward();
    await this.byte.slideTo(EXIT_TO, { duration: 1900 });
    this.pods.forEach(p => p.destroy()); this.pods = [];

    // swap the farm background UNDER the curtain so the change is a smooth fade
    await this.ui.fieldTransition(`Field ${this.level + 1}`, () => this.setField(this.level));
    const cfg = this.levels[this.level];
    // resolve the NEW farm's pathway and stand Byte on it BEFORE walking up from the bottom
    this._resolvePathX();
    this._placeByteColumn(this._pathX);
    this.byte.setTopPercent(ENTER_FROM, true);
    await sleep(120);
    await this.byte.slideTo(cfg.byteTop, { duration: 2200 });   // walk up the pathway
    this.ui.moveTile(cfg.byteTop);
    await sleep(150);
    await this.beginLevel();
  }

  async win(){
    this.ui.hideInstruction();
    playSound('win');
    await this.ui.bigMessage('ALL FIELDS SAVED! 🎉', 1400);
    this.particles.confetti();
    setTimeout(() => this.particles.confetti(), 700);
    $('#win').classList.add('show');
  }

  restart(){
    $('#win').classList.remove('show');
    this.pods.forEach(p => p.destroy()); this.pods = [];
    this.level = 0; this.busy = false; this.canTap = false;
    this.ui.hideHint();
    this.start();
  }
}

/* ============================================================
   Boot
   ============================================================ */
window.addEventListener('load', () => {
  audio.init();
  const game = new GameManager();
  const startScreen = $('#startScreen');

  // First tap unlocks the AudioContext (browser autoplay policy) AND kicks
  // off Byte's entrance — so every movement sound is audible from the start.
  const begin = () => {
    startScreen.removeEventListener('click', begin);
    audio.resume();
    audio.play('coin');                 // tiny confirmation blip
    startScreen.classList.add('hide');
    game.start();
  };
  startScreen.addEventListener('click', begin);
});
</script>
</body>
</html>
