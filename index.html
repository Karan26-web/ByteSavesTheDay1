<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Byte Saves The Day · Energy Farm</title>
<style>
/* ============================================================
   BYTE SAVES THE DAY — ENERGY FARM
   Single-file HTML5 game. Vanilla JS + CSS.

   KEY IDEA FOR ALIGNMENT:
   Everything lives inside #board, a fixed 16:9 element that exactly
   matches Background.svg (1920x1080). The board is scaled to "cover"
   the viewport. Because the board shares the background's aspect ratio,
   percentage positions map directly onto the background's painted tiles
   — so Byte, the glow tile and the pods sit on the real path/grass cells.

   Sections: 1) Stage/Board  2) Glow tile  3) Byte  4) Pods
             5) Effects  6) UI  7) Win
   ============================================================ */

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;background:#0d1b12;
  font-family:'Baloo 2','Comic Sans MS','Segoe UI Rounded','Nunito',system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;}

/* ---------- Stage (viewport) ---------- */
#stage{position:fixed;inset:0;width:100vw;height:100vh;overflow:hidden;background:#243018;}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:60;
  background:linear-gradient(180deg, rgba(20,40,20,.26) 0%, rgba(0,0,0,0) 16%,
             rgba(0,0,0,0) 74%, rgba(20,40,20,.28) 100%);}

/* ---------- Board: 16:9, covers the viewport, holds the background ---------- */
#board{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:max(100vw, calc(100vh * 16 / 9));
  height:max(100vh, calc(100vw * 9 / 16));
  background:url('assets/Background.svg') center center / 100% 100% no-repeat;}

.layer{position:absolute;inset:0;}
#objectLayer{z-index:20;}     /* pods + bush (children of the board → grid-aligned) */
#effectLayer{z-index:40;pointer-events:none;}  /* arm, coins, particles (stage → screen px) */
#uiLayer{z-index:70;pointer-events:none;}

/* ============================================================
   2) GLOW TILE  (soft yellow marker on Byte's current path cell)
   ============================================================ */
#tile{position:absolute;left:50%;width:7%;height:12.6%;
  transform:translate(-50%,-50%) scale(.7);
  background:radial-gradient(ellipse at center,
             rgba(255,228,135,.7) 0%, rgba(255,208,85,.34) 52%, rgba(255,200,70,0) 78%);
  border-radius:18px;opacity:0;
  transition:top .26s cubic-bezier(.34,1.5,.5,1), opacity .45s ease,
             transform .45s cubic-bezier(.34,1.5,.5,1);
  filter:drop-shadow(0 0 14px rgba(255,210,90,.6));pointer-events:none;}
#tile.show{opacity:1;transform:translate(-50%,-50%) scale(1);animation:tileGlow 1.7s ease-in-out infinite;}
@keyframes tileGlow{0%,100%{filter:drop-shadow(0 0 12px rgba(255,210,90,.5))}
  50%{filter:drop-shadow(0 0 26px rgba(255,222,120,.9))}}

/* ============================================================
   3) BYTE
   ============================================================ */
#byte{position:absolute;left:50%;top:91%;width:7.6%;
  transform:translate(-50%,-50%);
  transition:top .24s cubic-bezier(.34,1.55,.5,1), left .9s cubic-bezier(.34,1.4,.5,1);
  z-index:25;will-change:top;}

#byte .byte-shadow{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);
  width:60%;height:12%;border-radius:50%;z-index:0;pointer-events:none;
  background:radial-gradient(closest-side, rgba(0,0,0,.38), rgba(0,0,0,0));
  filter:blur(1px);animation:shadowPulse 3.2s ease-in-out infinite;}
#byte .byte-float{position:relative;z-index:1;animation:byteFloat 3.2s ease-in-out infinite;}
#byte .byte-breath{position:relative;animation:byteBreath 2.6s ease-in-out infinite;
  transform-origin:50% 100%;transition:transform .35s ease;}
#byte img{display:block;width:100%;height:auto;pointer-events:none;
  filter:drop-shadow(0 8px 10px rgba(0,0,0,.28));}

#byte.lean-left  .byte-breath{transform:rotate(-8deg) translateX(-5%);}
#byte.lean-right .byte-breath{transform:rotate(8deg)  translateX(5%);}
#byte.walking .byte-float{animation:byteWalk .26s ease-in-out infinite;}

#byte .byte-aura{position:absolute;inset:-22% -28%;border-radius:50%;
  background:radial-gradient(closest-side, rgba(90,200,255,.55), rgba(90,200,255,0) 70%);
  opacity:0;transition:opacity .25s ease;pointer-events:none;z-index:-1;}
#byte.charging .byte-aura{opacity:1;animation:auraPulse .7s ease-in-out infinite;}
#byte.happy .byte-float{animation:byteHappy .55s cubic-bezier(.34,1.5,.5,1) 2;}

@keyframes byteFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3.5%)}}
@keyframes shadowPulse{0%,100%{transform:translateX(-50%) scale(1);opacity:.85}50%{transform:translateX(-50%) scale(.86);opacity:.6}}
@keyframes byteBreath{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.975)}}
@keyframes byteWalk{0%,100%{transform:translateY(0)}50%{transform:translateY(-14%)}}
@keyframes byteHappy{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-22%) scale(1.06)}100%{transform:translateY(0) scale(1)}}
@keyframes auraPulse{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.12);opacity:.9}}

/* ---------- Byte's robotic arm (rAF width, horizontal reach) ---------- */
.byte-arm{position:absolute;height:clamp(11px,2.4vw,17px);
  transform-origin:0 50%;border-radius:999px;width:0;z-index:24;
  background:linear-gradient(180deg,#f2feff 0%,#9fe7ff 38%,#33b8ea 78%,#1f93c9 100%);
  box-shadow:0 3px 6px rgba(0,0,0,.3), inset 0 2px 2px rgba(255,255,255,.7);
  pointer-events:none;}
.byte-arm::before{content:"";position:absolute;inset:0;border-radius:999px;
  background:repeating-linear-gradient(90deg, rgba(0,0,0,.10) 0 2px, rgba(0,0,0,0) 2px 14px);}
.byte-arm .claw{position:absolute;right:-2px;top:50%;transform:translateY(-50%);
  width:clamp(16px,3.4vw,24px);height:clamp(16px,3.4vw,24px);border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #fff, #6fd6ff 55%, #2196c9);
  box-shadow:0 0 0 2px rgba(255,255,255,.6), 0 2px 5px rgba(0,0,0,.35);}
.byte-arm .claw::before,.byte-arm .claw::after{content:"";position:absolute;right:-6px;
  width:clamp(9px,2vw,13px);height:clamp(5px,1.1vw,7px);background:#2aa6d6;border-radius:0 6px 6px 0;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.5);}
.byte-arm .claw::before{top:8%;transform:rotate(-22deg);transform-origin:left center;}
.byte-arm .claw::after{bottom:8%;transform:rotate(22deg);transform-origin:left center;}

/* ============================================================
   4) ENERGY PODS (capsules placed LEFT / RIGHT of the path)
   ============================================================ */
.pod{position:absolute;width:6.6%;
  transform:translate(-50%,-50%);z-index:18;cursor:pointer;
  animation:podBounce 2.4s ease-in-out infinite;
  transition:transform .18s ease, opacity .4s ease;}
.pod.appear{animation:podBounce 2.4s ease-in-out infinite, podSpawn .5s cubic-bezier(.34,1.5,.5,1) both;}
.pod:active{transform:translate(-50%,-50%) scale(.93);}

.pod .pod-body{position:relative;width:100%;aspect-ratio:.7;
  border-radius:50% 50% 46% 46% / 30% 30% 22% 22%;
  background:linear-gradient(160deg,#eafbff 0%,#bfeeff 30%,#7cd2f5 62%,#3aa7da 100%);
  box-shadow:inset 0 6px 10px rgba(255,255,255,.85), inset 0 -10px 16px rgba(20,90,130,.45),
             0 8px 14px rgba(0,0,0,.28);
  border:3px solid rgba(255,255,255,.75);overflow:hidden;}
.pod .pod-glass{position:absolute;inset:14% 18% 30%;border-radius:46% 46% 40% 40%;
  background:linear-gradient(180deg, rgba(255,255,255,.55), rgba(120,200,235,.12));
  box-shadow:inset 0 0 12px rgba(255,255,255,.6);}
.pod .pod-shine{position:absolute;top:10%;left:16%;width:24%;height:40%;border-radius:50%;
  background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,0));transform:rotate(-12deg);}

.pod .pod-lid{position:absolute;top:-2%;left:50%;transform:translateX(-50%);
  width:78%;height:30%;border-radius:50%;z-index:3;transform-origin:50% 120%;
  background:linear-gradient(160deg,#ffffff,#9fe0ff 70%,#4fb6e3);
  box-shadow:0 3px 6px rgba(0,0,0,.25), inset 0 2px 3px rgba(255,255,255,.9);
  transition:transform .45s cubic-bezier(.34,1.7,.5,1), opacity .4s ease;}
.pod.open .pod-lid{transform:translate(-50%,-180%) rotate(-32deg) scale(.9);opacity:0;}

.pod .pod-glow{position:absolute;inset:-12%;border-radius:46%;pointer-events:none;
  box-shadow:0 0 0 0 rgba(255,225,90,0);opacity:0;}
.pod.hint .pod-glow{opacity:1;animation:podHintGlow 1.25s ease-in-out infinite;}
.pod.burst .pod-glow{opacity:1;animation:podBurst .6s ease-out forwards;}

.pod .pod-base{position:absolute;bottom:-6%;left:50%;transform:translateX(-50%);
  width:64%;height:14%;border-radius:50%;background:linear-gradient(#2b6c8d,#16455c);
  box-shadow:0 4px 6px rgba(0,0,0,.3);z-index:1;}

.pod .pod-arrow{position:absolute;top:-46%;left:50%;transform:translateX(-50%);
  font-size:clamp(22px,5vw,34px);color:#ffd23f;text-shadow:0 2px 4px rgba(0,0,0,.35);
  animation:arrowBob 1s ease-in-out infinite;display:none;}
.pod.hint .pod-arrow{display:block;}

@keyframes podBounce{0%,100%{translate:0 0}50%{translate:0 -6%}}
@keyframes podSpawn{0%{opacity:0;transform:translate(-50%,-30%) scale(.4)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes podHintGlow{0%,100%{box-shadow:0 0 16px 4px rgba(255,210,60,.55)}50%{box-shadow:0 0 34px 12px rgba(255,210,60,.9)}}
@keyframes podBurst{0%{box-shadow:0 0 0 0 rgba(255,240,150,.95)}100%{box-shadow:0 0 60px 30px rgba(255,240,150,0)}}
@keyframes arrowBob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(8px)}}

.pod.shake{animation:podShake .5s ease;}
@keyframes podShake{0%,100%{transform:translate(-50%,-50%) rotate(0)}
  20%{transform:translate(-54%,-50%) rotate(-6deg)}40%{transform:translate(-46%,-50%) rotate(6deg)}
  60%{transform:translate(-53%,-50%) rotate(-4deg)}80%{transform:translate(-47%,-50%) rotate(4deg)}}

/* ============================================================
   5) EFFECTS  (coin, particles, leaves, bush, bunny) — screen-positioned
   ============================================================ */
.coin{position:absolute;width:clamp(34px,7.5vw,52px);height:clamp(34px,7.5vw,52px);
  transform:translate(-50%,-50%);z-index:42;pointer-events:none;
  border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 38% 32%, #fff6c2, #ffd23f 52%, #f5a623 100%);
  box-shadow:0 0 18px 6px rgba(255,210,60,.8), inset 0 2px 4px rgba(255,255,255,.7);
  transition:transform .72s cubic-bezier(.5,.05,.4,1), opacity .3s ease;
  animation:coinSpin 1.4s ease-in-out infinite;}
.coin svg{width:58%;height:58%;filter:drop-shadow(0 1px 1px rgba(120,70,0,.5));}
@keyframes coinSpin{0%,100%{transform:translate(-50%,-50%) rotate(-8deg)}50%{transform:translate(-50%,-50%) rotate(8deg)}}

.particle{position:absolute;border-radius:50%;pointer-events:none;z-index:41;
  transform:translate(-50%,-50%);will-change:transform,opacity;
  animation:particleFly var(--dur,.9s) ease-out forwards;}
@keyframes particleFly{
  0%{opacity:1;transform:translate(-50%,-50%) translate(0,0) scale(1)}
  100%{opacity:0;transform:translate(-50%,-50%) translate(var(--tx),var(--ty)) scale(.2)}}

.leaf{position:absolute;width:clamp(12px,2.6vw,18px);height:clamp(8px,1.8vw,12px);
  background:linear-gradient(120deg,#a6e85a,#5fb226);border-radius:0 100% 0 100%;
  z-index:43;pointer-events:none;transform:translate(-50%,-50%);
  box-shadow:inset 0 0 3px rgba(0,0,0,.15);
  animation:leafFly var(--dur,1.1s) cubic-bezier(.3,.7,.5,1) forwards;}
@keyframes leafFly{
  0%{opacity:1;transform:translate(-50%,-50%) translate(0,0) rotate(0)}
  100%{opacity:0;transform:translate(-50%,-50%) translate(var(--tx),var(--ty)) rotate(var(--rot))}}

.bush{position:absolute;width:8.5%;aspect-ratio:1.4;
  transform:translate(-50%,-50%);z-index:23;pointer-events:none;
  animation:bushSway 3s ease-in-out infinite;}
.bush span{position:absolute;bottom:0;border-radius:50%;
  background:radial-gradient(circle at 38% 30%, #8ed94f, #4f9e2a 70%, #3a7d1e);
  box-shadow:inset 0 -6px 8px rgba(0,0,0,.18), inset 0 4px 6px rgba(255,255,255,.25);}
.bush .b1{width:48%;height:78%;left:0;}
.bush .b2{width:60%;height:100%;left:26%;}
.bush .b3{width:46%;height:74%;right:0;}
.bush.rustle{animation:bushRustle .5s ease;}
@keyframes bushSway{0%,100%{transform:translate(-50%,-50%) rotate(-1.5deg)}50%{transform:translate(-50%,-50%) rotate(1.5deg)}}
@keyframes bushRustle{0%,100%{transform:translate(-50%,-50%) scale(1)}25%{transform:translate(-52%,-52%) scale(1.06,.94)}50%{transform:translate(-48%,-50%) scale(.95,1.07)}75%{transform:translate(-51%,-50%) scale(1.04,.97)}}

.bunny{position:absolute;font-size:clamp(40px,9vw,64px);z-index:44;pointer-events:none;
  transform:translate(-50%,40%) scale(.3);opacity:0;filter:drop-shadow(0 6px 6px rgba(0,0,0,.3));}
.bunny.show{animation:bunnyPop .8s cubic-bezier(.34,1.6,.5,1) forwards;}
.bunny.hide{animation:bunnyHide .4s ease forwards;}
@keyframes bunnyPop{0%{transform:translate(-50%,40%) scale(.3);opacity:0}
  55%{transform:translate(-50%,-58%) scale(1.12);opacity:1}75%{transform:translate(-50%,-44%) scale(.96)}
  100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes bunnyHide{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,30%) scale(.4)}}

.bubble{position:absolute;transform:translate(-50%,-50%) scale(.6);opacity:0;z-index:45;
  pointer-events:none;background:#fff;color:#2b2b2b;font-weight:700;
  padding:.5em .8em;border-radius:14px;white-space:nowrap;
  font-size:clamp(13px,3.2vw,18px);box-shadow:0 6px 14px rgba(0,0,0,.25);
  transition:transform .3s cubic-bezier(.34,1.6,.5,1), opacity .3s ease;}
.bubble::after{content:"";position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);
  border:9px solid transparent;border-top-color:#fff;border-bottom:0;}
.bubble.show{transform:translate(-50%,-50%) scale(1);opacity:1;}

/* ============================================================
   6) UI  (screen-fixed)
   ============================================================ */
#battery{position:absolute;top:clamp(12px,3vh,22px);left:50%;transform:translateX(-50%);
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.9);border-radius:999px;padding:6px 14px 6px 10px;
  box-shadow:0 5px 14px rgba(0,0,0,.2);pointer-events:none;}
#battery .cell{position:relative;width:clamp(46px,12vw,64px);height:clamp(20px,5vw,26px);
  border:3px solid #4a4a4a;border-radius:6px;background:#eef3ee;overflow:hidden;}
#battery .cell::after{content:"";position:absolute;right:-7px;top:50%;transform:translateY(-50%);
  width:5px;height:45%;background:#4a4a4a;border-radius:0 3px 3px 0;}
#battery .fill{position:absolute;inset:2px;width:15%;border-radius:3px;
  background:linear-gradient(90deg,#ff5a5a,#ff8a3d);
  transition:width .8s cubic-bezier(.4,1,.5,1), background .6s ease;}
#battery .pct{font-weight:800;color:#3a3a3a;font-size:clamp(13px,3.4vw,17px);min-width:3ch;text-align:right;}
#battery .bolt{font-size:clamp(15px,4vw,20px);}

#instruction{position:absolute;left:50%;bottom:clamp(16px,4vh,34px);transform:translateX(-50%) translateY(20px);
  width:min(86vw,560px);background:rgba(255,255,255,.96);border-radius:22px;
  padding:clamp(14px,3.5vw,22px) clamp(16px,4vw,26px);
  box-shadow:0 12px 30px rgba(0,0,0,.28), inset 0 0 0 3px rgba(120,200,235,.4);
  opacity:0;transition:opacity .45s ease, transform .45s cubic-bezier(.34,1.4,.5,1);
  pointer-events:none;}
#instruction.show{opacity:1;transform:translateX(-50%) translateY(0);}
#instruction .txt{color:#34414d;font-weight:700;line-height:1.4;
  font-size:clamp(16px,4.4vw,23px);min-height:1.4em;}
#instruction .caret{display:inline-block;width:3px;height:1.05em;background:#34b6e6;
  margin-left:2px;vertical-align:-2px;animation:blink .7s step-end infinite;}
#instruction .cont{margin-top:8px;font-size:clamp(11px,3vw,14px);color:#8aa0ad;font-weight:700;
  opacity:0;transition:opacity .3s ease;}
#instruction .cont.show{opacity:1;animation:contPulse 1.3s ease-in-out infinite;}
@keyframes blink{50%{opacity:0}}
@keyframes contPulse{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}

#hintChip{position:absolute;left:50%;top:clamp(58px,12vh,96px);transform:translateX(-50%) scale(.8);
  background:rgba(54,182,230,.95);color:#fff;font-weight:800;
  padding:.5em 1em;border-radius:999px;font-size:clamp(13px,3.4vw,17px);
  box-shadow:0 6px 16px rgba(0,0,0,.25);opacity:0;transition:opacity .4s ease, transform .4s cubic-bezier(.34,1.5,.5,1);
  pointer-events:none;max-width:84vw;text-align:center;}
#hintChip.show{opacity:1;transform:translateX(-50%) scale(1);}

#bigMsg{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.6);
  color:#fff;font-weight:900;text-align:center;opacity:0;pointer-events:none;z-index:75;
  font-size:clamp(26px,8vw,52px);text-shadow:0 4px 0 #1b9bd1, 0 8px 18px rgba(0,0,0,.4);
  transition:opacity .35s ease, transform .45s cubic-bezier(.34,1.6,.5,1);}
#bigMsg.show{opacity:1;transform:translate(-50%,-50%) scale(1);}

#tapCatcher{position:absolute;inset:0;z-index:65;display:none;cursor:pointer;}
#tapCatcher.on{display:block;pointer-events:auto;}

#sndBtn{position:absolute;top:clamp(12px,3vh,22px);right:clamp(12px,3vw,20px);
  width:clamp(40px,10vw,50px);height:clamp(40px,10vw,50px);border-radius:50%;border:none;
  background:rgba(255,255,255,.9);box-shadow:0 5px 14px rgba(0,0,0,.2);cursor:pointer;
  font-size:clamp(18px,5vw,24px);z-index:72;pointer-events:auto;
  display:grid;place-items:center;transition:transform .12s ease;}
#sndBtn:active{transform:scale(.9);}

/* ---------- Start gate ---------- */
#startScreen{position:absolute;inset:0;z-index:95;display:flex;flex-direction:column;
  align-items:center;justify-content:center;cursor:pointer;text-align:center;padding:0 6vw;
  background:radial-gradient(circle at 50% 40%, rgba(30,110,150,.55), rgba(8,24,32,.82));
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);transition:opacity .5s ease;}
#startScreen.hide{opacity:0;pointer-events:none;}
#startScreen .emoji{font-size:clamp(50px,15vw,92px);margin-bottom:.1em;animation:winBounce 1.4s ease-in-out infinite;}
#startScreen h1{color:#fff;font-size:clamp(28px,8vw,56px);text-shadow:0 4px 0 #1b9bd1, 0 8px 18px rgba(0,0,0,.45);}
#startScreen .title2{color:#bfeeff;font-weight:800;font-size:clamp(18px,5vw,28px);margin-top:.1em;letter-spacing:.04em;}
#startScreen .sub{color:#dff4ff;font-weight:800;margin-top:1em;font-size:clamp(15px,4.5vw,22px);
  animation:contPulse 1.3s ease-in-out infinite;}

/* ============================================================
   7) WIN SCREEN
   ============================================================ */
#win{position:absolute;inset:0;z-index:90;display:none;
  background:radial-gradient(circle at 50% 40%, rgba(40,120,160,.6), rgba(10,30,40,.85));
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);align-items:center;justify-content:center;
  opacity:0;transition:opacity .5s ease;pointer-events:auto;}
#win.show{display:flex;opacity:1;}
#win .card{background:rgba(255,255,255,.97);border-radius:28px;padding:clamp(24px,6vw,44px);
  width:min(86vw,460px);text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.4);
  transform:scale(.7);transition:transform .5s cubic-bezier(.34,1.5,.5,1);}
#win.show .card{transform:scale(1);}
#win h1{color:#1f93c9;font-size:clamp(24px,6.5vw,38px);margin-bottom:.3em;}
#win p{color:#4a5b66;font-weight:700;font-size:clamp(15px,4vw,19px);margin-bottom:1.1em;line-height:1.4;}
#win .emoji{font-size:clamp(48px,14vw,84px);margin-bottom:.1em;animation:winBounce 1.4s ease-in-out infinite;}
@keyframes winBounce{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-12%) rotate(4deg)}}
#win button{font:inherit;font-weight:800;color:#fff;cursor:pointer;border:none;
  background:linear-gradient(180deg,#48c6f0,#1f93c9);padding:.7em 1.6em;border-radius:999px;
  font-size:clamp(16px,4.4vw,20px);box-shadow:0 6px 0 #156a92, 0 10px 18px rgba(0,0,0,.3);
  transition:transform .12s ease, box-shadow .12s ease;}
#win button:active{transform:translateY(4px);box-shadow:0 2px 0 #156a92, 0 4px 10px rgba(0,0,0,.3);}
</style>
</head>
<body>
<div id="stage">
  <!-- 16:9 board carrying the background + grid-aligned objects -->
  <div id="board">
    <div id="tile"></div>
    <div id="objectLayer" class="layer"></div>
    <div id="byte">
      <div class="byte-shadow"></div>
      <div class="byte-float">
        <div class="byte-aura"></div>
        <div class="byte-breath">
          <img src="assets/image.png" alt="Byte the robot" draggable="false" />
        </div>
      </div>
    </div>
  </div>

  <!-- screen-space effects (arm, coins, particles) -->
  <div id="effectLayer" class="layer"></div>

  <!-- UI -->
  <div id="uiLayer" class="layer">
    <div id="battery">
      <span class="bolt">🔋</span>
      <div class="cell"><div class="fill"></div></div>
      <span class="pct">15%</span>
    </div>
    <div id="hintChip"></div>
    <div id="bigMsg"></div>
    <div id="instruction">
      <div class="txt"></div>
      <div class="cont">▼ tap to continue</div>
    </div>
  </div>

  <button id="sndBtn" title="Sound on/off">🔊</button>
  <div id="tapCatcher"></div>

  <!-- Start gate (also unlocks audio on first tap) -->
  <div id="startScreen">
    <div class="emoji">🤖</div>
    <h1>Byte Saves the Day</h1>
    <div class="title2">Energy Farm</div>
    <div class="sub">▶ Tap to Start</div>
  </div>

  <!-- Win -->
  <div id="win">
    <div class="card">
      <div class="emoji">🤖⚡</div>
      <h1>Byte is Fully Charged!</h1>
      <p>You found all the energy pods and saved the day. Now Byte can go deliver the parcels!</p>
      <button id="replayBtn">Play Again</button>
    </div>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   Helpers
   ============================================================ */
const $  = (s, r=document) => r.querySelector(s);
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const rand  = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

const stage = $('#stage');
const board = $('#board');
const objectLayer = $('#objectLayer');   // child of board → percentages align to grid
const effectLayer = $('#effectLayer');   // child of stage → screen pixels

/** centre of an element in STAGE/screen pixels (used for the arm & effects) */
function centerOf(el){
  const s = stage.getBoundingClientRect();
  const r = el.getBoundingClientRect();
  return { x: r.left - s.left + r.width/2, y: r.top - s.top + r.height/2 };
}

/* ------------------------------------------------------------
   PATH GEOMETRY (in BOARD %, matching Background.svg 1920x1080)
   The painted path runs down the centre; its 6 cells sit at these
   vertical centres. Byte enters from below, slides to the road,
   then hops cell-by-cell.
   ------------------------------------------------------------ */
const PATH_X    = 50;                                   // path centre (x %)
const TILE_TOPS = [17, 29.3, 41.7, 54.1, 66.4, 78.8];   // top→bottom cell centres (y %)
const ENTER_FROM = 110;     // start below the board
const ROAD_STOP  = 92;      // smooth-slide target (bottom road, just under cell 5)

/* ============================================================
   AudioManager — synthesised, soft kid-friendly SFX (Web Audio API)
   ============================================================ */
class AudioManager {
  constructor(){ this.ctx=null; this.master=null; this.enabled=true; this._stepIdx=0; }
  init(){
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { this.enabled=false; return; }
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.3;
    this.master.connect(this.ctx.destination);
  }
  resume(){ if (this.ctx && this.ctx.state==='suspended') this.ctx.resume(); }
  toggle(){ this.enabled = !this.enabled; return this.enabled; }

  _tone({ freq, dur=.2, type='sine', gain=.25, slideTo=null, when=0 }){
    if (!this.ctx) return;
    const t = this.ctx.currentTime + when;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.master);
    o.start(t); o.stop(t + dur + 0.05);
  }
  _noise({ dur=.08, gain=.25, when=0 }){
    if (!this.ctx) return;
    const t = this.ctx.currentTime + when;
    const n = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(g); g.connect(this.master); src.start(t);
  }

  play(name){
    if (!this.enabled || !this.ctx) return;
    this.resume();
    switch(name){
      case 'slide':  // soft whoosh as Byte glides in
        this._tone({ freq:300, slideTo:520, dur:.7, type:'sine',     gain:.14 });
        this._tone({ freq:150, slideTo:260, dur:.7, type:'triangle', gain:.08 });
        break;
      case 'step': { // soft hop "boop" — cycles a gentle scale into a little tune
        const notes = [523,587,659,587,523,494];
        const f = notes[this._stepIdx++ % notes.length];
        this._tone({ freq:f,    dur:.16, type:'triangle', gain:.20 });
        this._tone({ freq:f/2,  dur:.18, type:'sine',     gain:.10 });
        this._noise({ dur:.04, gain:.06 });   // soft landing tick
        break;
      }
      case 'arm':
        this._tone({ freq:170, slideTo:520, dur:.45, type:'sawtooth', gain:.10 });
        break;
      case 'pop':
        this._noise({ dur:.07, gain:.18 });
        this._tone({ freq:680, slideTo:1300, dur:.13, type:'sine', gain:.18 });
        break;
      case 'coin':
        this._tone({ freq:988,  dur:.08, type:'square', gain:.16 });
        this._tone({ freq:1319, dur:.20, type:'square', gain:.16, when:.08 });
        break;
      case 'charge':
        [523,659,784,1047].forEach((f,i) =>
          this._tone({ freq:f, dur:.16, type:'triangle', gain:.15, when:i*.08 }));
        break;
      case 'wrong':
        this._tone({ freq:380, slideTo:120, dur:.5, type:'sawtooth', gain:.15 });
        this._tone({ freq:190, slideTo:90,  dur:.5, type:'square',   gain:.06 });
        break;
      case 'bunny':
        [[880,0],[1100,.09],[860,.18],[1180,.27]].forEach(([f,w]) =>
          this._tone({ freq:f, dur:.09, type:'square', gain:.10, when:w }));
        break;
      case 'win':
        [523,659,784,1047,1319].forEach((f,i) =>
          this._tone({ freq:f, dur:i===4?.5:.16, type:'triangle', gain:.17, when:i*.12 }));
        break;
    }
  }
}
const audio = new AudioManager();
/* public placeholder API (drives the AudioManager):
   playSound("slide"|"step"|"arm"|"charge"|"pop"|"wrong"|"coin"|"bunny"|"win") */
function playSound(name){ audio.play(name); }

/* ============================================================
   ParticleSystem — CSS-animated, self-cleaning
   ============================================================ */
class ParticleSystem {
  constructor(layer){ this.layer = layer; }
  emit(type, x, y, count = 12){
    for (let i = 0; i < count; i++){
      const ang = rand(0, Math.PI*2), dist = rand(40, 130);
      const tx = Math.cos(ang)*dist, ty = Math.sin(ang)*dist;
      const p = document.createElement('div');
      p.className = (type === 'leaf') ? 'leaf' : 'particle';
      p.style.left = x + 'px'; p.style.top = y + 'px';
      p.style.setProperty('--tx', tx.toFixed(1)+'px');
      p.style.setProperty('--ty', ty.toFixed(1)+'px');
      p.style.setProperty('--dur', rand(0.7,1.3).toFixed(2)+'s');
      if (type === 'leaf'){
        p.style.setProperty('--rot', rand(-540,540).toFixed(0)+'deg');
        p.style.setProperty('--ty', (Math.abs(ty)*rand(.6,1.2)+rand(10,40)).toFixed(1)+'px');
      } else {
        const size = rand(6, 14);
        p.style.width = p.style.height = size+'px';
        p.style.background = (type === 'charge')
          ? 'radial-gradient(circle, #d6f4ff, #4fc3f7)'
          : 'radial-gradient(circle, #fff6c2, #ffd23f)';
        p.style.boxShadow = (type === 'charge')
          ? '0 0 8px 2px rgba(80,195,247,.8)'
          : '0 0 8px 2px rgba(255,210,60,.8)';
      }
      p.addEventListener('animationend', () => p.remove(), { once:true });
      this.layer.appendChild(p);
    }
  }
  confetti(){
    const w = stage.clientWidth;
    for (let i=0;i<60;i++){
      const p = document.createElement('div');
      p.className='particle';
      const size = rand(7,13);
      p.style.left=rand(0,w)+'px'; p.style.top='-20px';
      p.style.width=p.style.height=size+'px';
      p.style.borderRadius= Math.random()<.5?'50%':'2px';
      const hues=['#ff5a5a','#ffd23f','#4fc3f7','#8ed94f','#c77dff'];
      p.style.background=hues[i%hues.length];
      p.style.setProperty('--tx',rand(-60,60).toFixed(0)+'px');
      p.style.setProperty('--ty',(stage.clientHeight+60).toFixed(0)+'px');
      p.style.setProperty('--dur',rand(1.6,2.8).toFixed(2)+'s');
      p.addEventListener('animationend',()=>p.remove(),{once:true});
      effectLayer.appendChild(p);
    }
  }
}

/* ============================================================
   Byte
   ============================================================ */
class Byte {
  constructor(el, particles){ this.el = el; this.particles = particles; this.arm = null; }
  setTopPercent(p){ this.el.style.top = p + '%'; }

  /** smooth glide (the "walk in to the road" entrance) */
  async slideTo(topPercent){
    playSound('slide');
    this.el.style.transition = 'top 1s cubic-bezier(.45,.05,.3,1)';
    this.el.classList.add('walking');
    this.setTopPercent(topPercent);
    await sleep(1000);
    this.el.classList.remove('walking');
    this.el.style.transition = '';        // revert to the snappy per-hop default
  }

  /** one discrete cell hop (lands on a path tile) */
  async hop(topPercent){
    playSound('step');
    this.el.classList.add('walking');
    this.setTopPercent(topPercent);       // uses the short bouncy CSS transition
    await sleep(260);
    this.el.classList.remove('walking');
  }

  /** hop through a sequence of tile centres, firing onStep after each landing */
  async hopThrough(tops, onStep){
    for (const t of tops){ await this.hop(t); if (onStep) onStep(t); }
  }

  leanTo(pod){
    const b = centerOf(this.el), p = centerOf(pod.el);
    this.el.classList.remove('lean-left','lean-right');
    this.el.classList.add(p.x < b.x ? 'lean-left' : 'lean-right');
  }
  resetLean(){ this.el.classList.remove('lean-left','lean-right'); }

  /** Extend a robotic arm toward target. Pierces a bush in the path. */
  extendArm(targetEl, bush){
    return new Promise(resolve => {
      playSound('arm');
      const hand = centerOf(this.el);
      hand.y += this.el.clientHeight * 0.02;
      const tgt  = centerOf(targetEl);
      const dx = tgt.x - hand.x, dy = tgt.y - hand.y;
      const dist  = Math.hypot(dx, dy);
      const angle = Math.atan2(dy, dx);

      const arm = document.createElement('div');
      arm.className = 'byte-arm';
      arm.innerHTML = '<div class="claw"></div>';
      arm.style.left = hand.x + 'px';
      arm.style.top  = hand.y + 'px';
      arm.style.transform = `rotate(${angle}rad)`;
      effectLayer.appendChild(arm);      // screen-space layer
      this.arm = arm;

      let bushDist = Infinity, leafDone = false;
      if (bush){
        const bc = centerOf(bush.el);
        bushDist = Math.hypot(bc.x - hand.x, bc.y - hand.y) * 0.9;
      }
      const DUR = 620, start = performance.now();
      const easeOutElastic = t => {
        if (t === 0 || t === 1) return t;
        const p = 0.42;
        return Math.pow(2,-9*t)*Math.sin((t - p/4)*(2*Math.PI)/p) + 1;
      };
      const step = (now) => {
        const t = clamp((now - start)/DUR, 0, 1);
        const w = dist * easeOutElastic(t);
        arm.style.width = Math.max(0, w) + 'px';
        if (!leafDone && bush && w >= bushDist){
          leafDone = true; bush.rustle();
          const bc = centerOf(bush.el);
          this.particles.emit('leaf', bc.x, bc.y - bush.el.clientHeight*0.2, 14);
        }
        if (t < 1) requestAnimationFrame(step); else resolve();
      };
      requestAnimationFrame(step);
    });
  }

  retractArm(){
    return new Promise(resolve => {
      const arm = this.arm;
      if (!arm){ resolve(); return; }
      const startW = parseFloat(arm.style.width) || 0;
      const DUR = 320, start = performance.now();
      const step = now => {
        const t = clamp((now - start)/DUR, 0, 1);
        arm.style.width = (startW * (1 - t)) + 'px';
        if (t < 1) requestAnimationFrame(step);
        else { arm.remove(); this.arm = null; resolve(); }
      };
      requestAnimationFrame(step);
    });
  }

  startCharge(){ this.el.classList.add('charging'); }
  stopCharge(){ this.el.classList.remove('charging'); }
  cheer(){ this.el.classList.add('happy'); setTimeout(()=>this.el.classList.remove('happy'),1200); }
}

/* ============================================================
   EnergyPod
   ============================================================ */
class EnergyPod {
  constructor({ leftPct, topPct, hasEnergy, hint }){
    this.hasEnergy = hasEnergy;
    this.el = document.createElement('div');
    this.el.className = 'pod appear' + (hint ? ' hint' : '');
    this.el.style.left = leftPct + '%';
    this.el.style.top  = topPct + '%';
    this.el.innerHTML = `
      <div class="pod-arrow">⬇</div>
      <div class="pod-glow"></div>
      <div class="pod-body">
        <div class="pod-glass"></div>
        <div class="pod-shine"></div>
        <div class="pod-lid"></div>
      </div>
      <div class="pod-base"></div>`;
    objectLayer.appendChild(this.el);     // board child → grid-aligned
  }
  enableTap(handler){ this._h = () => handler(this); this.el.addEventListener('click', this._h); }
  disableTap(){ if (this._h) this.el.removeEventListener('click', this._h); }
  open(){ playSound('pop'); this.el.classList.add('open','burst'); }
  shake(){ this.el.classList.add('shake'); setTimeout(()=>this.el.classList.remove('shake'),520); }

  async bunnyGag(){
    playSound('bunny');
    const c = centerOf(this.el);
    const bunny = document.createElement('div');
    bunny.className = 'bunny'; bunny.textContent = '🐰';
    bunny.style.left = c.x + 'px'; bunny.style.top = c.y + 'px';
    effectLayer.appendChild(bunny);
    const bubble = document.createElement('div');
    bubble.className = 'bubble'; bubble.textContent = 'Hehehe! No energy here!';
    bubble.style.left = c.x + 'px';
    bubble.style.top  = (c.y - this.el.clientHeight*0.95) + 'px';
    effectLayer.appendChild(bubble);
    requestAnimationFrame(() => bunny.classList.add('show'));
    await sleep(450); bubble.classList.add('show');
    await sleep(1500);
    bubble.classList.remove('show');
    bunny.classList.remove('show'); bunny.classList.add('hide');
    await sleep(420); bunny.remove(); bubble.remove();
  }
  reset(){ this.el.classList.remove('open','burst'); }
  destroy(){ this.disableTap(); this.el.remove(); }
}

/* ============================================================
   Bush
   ============================================================ */
class Bush {
  constructor({ leftPct, topPct }){
    this.el = document.createElement('div');
    this.el.className = 'bush';
    this.el.style.left = leftPct + '%';
    this.el.style.top  = topPct + '%';
    this.el.innerHTML = '<span class="b1"></span><span class="b2"></span><span class="b3"></span>';
    objectLayer.appendChild(this.el);
  }
  rustle(){ this.el.classList.add('rustle'); setTimeout(()=>this.el.classList.remove('rustle'),500); }
  destroy(){ this.el.remove(); }
}

/* ============================================================
   UIManager
   ============================================================ */
class UIManager {
  constructor(){
    this.instr   = $('#instruction');
    this.instrTxt= $('.txt', this.instr);
    this.cont    = $('.cont', this.instr);
    this.hintChip= $('#hintChip');
    this.bigMsg  = $('#bigMsg');
    this.battery = { fill: $('#battery .fill'), pct: $('#battery .pct') };
    this.tapCatcher = $('#tapCatcher');
    this.tile = $('#tile');
    this._battery = 15;
    this.setBattery(15, false);
  }
  async showText(text, { wait = true } = {}){
    this.instr.classList.add('show');
    this.cont.classList.remove('show');
    this.instrTxt.textContent = '';
    const caret = document.createElement('span'); caret.className = 'caret';
    this.instrTxt.appendChild(caret);
    for (let i = 0; i < text.length; i++){
      caret.insertAdjacentText('beforebegin', text[i]);
      await sleep(text[i] === ' ' ? 18 : 34);
    }
    caret.remove();
    if (wait){ this.cont.classList.add('show'); await this.waitForTap(); this.cont.classList.remove('show'); }
  }
  hideInstruction(){ this.instr.classList.remove('show'); }
  waitForTap(){
    return new Promise(resolve => {
      this.tapCatcher.classList.add('on');
      const done = () => { this.tapCatcher.classList.remove('on');
        this.tapCatcher.removeEventListener('click', done); resolve(); };
      this.tapCatcher.addEventListener('click', done);
    });
  }
  showHint(text){ this.hintChip.textContent = text; this.hintChip.classList.add('show'); }
  hideHint(){ this.hintChip.classList.remove('show'); }
  async bigMessage(text, ms = 1600){
    this.bigMsg.textContent = text; this.bigMsg.classList.add('show');
    await sleep(ms); this.bigMsg.classList.remove('show'); await sleep(350);
  }
  /** glow tile follows Byte's current path cell (board %) */
  moveTile(topPercent){ this.tile.style.top = topPercent + '%'; this.tile.classList.add('show'); }
  hideTile(){ this.tile.classList.remove('show'); }
  setBattery(pct, animate = true){
    this._battery = clamp(pct, 0, 100);
    const f = this.battery.fill;
    if (!animate) f.style.transition = 'none';
    f.style.width = this._battery + '%';
    if (!animate) requestAnimationFrame(() => f.style.transition = '');
    this.battery.pct.textContent = Math.round(this._battery) + '%';
    f.style.background = this._battery < 35
      ? 'linear-gradient(90deg,#ff5a5a,#ff8a3d)'
      : this._battery < 70
        ? 'linear-gradient(90deg,#ffb13d,#ffe14d)'
        : 'linear-gradient(90deg,#7ee04d,#39c44a)';
  }
}

/* ============================================================
   GameManager — flow & state machine
   ============================================================ */
const COIN_SVG = '<svg viewBox="0 0 24 24"><path fill="#7a4a00" d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg>';
const LEFT_X = 29, RIGHT_X = 71;     // pod horizontal positions (board %)

class GameManager {
  constructor(){
    this.particles = new ParticleSystem(effectLayer);
    this.ui   = new UIManager();
    this.byte = new Byte($('#byte'), this.particles);
    this.pods = [];
    this.bush = null;
    this.busy = false;
    this.canTap = false;

    /* Levels sit on the upper path cells. Byte's entrance lands it on the
       4th rock (TILE_TOPS[2]); each cleared level hops one cell higher. */
    this.levels = [
      { byteTop: TILE_TOPS[2], hint:true,  bush:false,
        layout:[{side:'left',energy:true},{side:'right',energy:false}],
        hintText:'Tap the pod near Byte — it has the energy cell!' },
      { byteTop: TILE_TOPS[1], hint:true,  bush:true,
        layout:[{side:'left',energy:false},{side:'right',energy:true}],
        hintText:'Reach through the bush to the glowing pod!' },
      { byteTop: TILE_TOPS[0], hint:false, bush:false, random:true,
        layout:[{side:'left',energy:false},{side:'right',energy:false}],
        hintText:'Which pod has the energy? You decide!' },
    ];
    this.level = 0;
    this.batterySteps = [45, 73, 100];

    $('#replayBtn').addEventListener('click', () => this.restart());
    const sndBtn = $('#sndBtn');
    sndBtn.addEventListener('click', () => {
      const on = audio.toggle();
      sndBtn.textContent = on ? '🔊' : '🔇';
      if (on) audio.play('coin');
    });
    stage.addEventListener('pointerdown', () => audio.resume(), { passive:true });
  }

  async start(){
    // 1) smooth slide from below up to the road
    this.byte.setTopPercent(ENTER_FROM);
    await sleep(200);
    await this.byte.slideTo(ROAD_STOP);
    await sleep(120);

    // 2) hop the rocks: 1st → 2nd → 3rd → 4th cell (game starts on the 4th)
    const rocks = [TILE_TOPS[5], TILE_TOPS[4], TILE_TOPS[3], TILE_TOPS[2]];
    await this.byte.hopThrough(rocks, top => this.ui.moveTile(top));
    await sleep(150);

    await this.runIntro();
    this.beginLevel();
  }

  async runIntro(){
    await this.ui.showText('Welcome to the Energy Farm!');
    this.spawnPods(this.levels[0], false);      // pods appear while we talk about them
    await this.ui.showText('Energy is stored here as coins inside these pods.');
    await this.ui.showText('Some pods have the energy coin while some do not.');
    this.ui.hideInstruction();
    await sleep(300);
  }

  _x(side){ return side === 'left' ? LEFT_X : RIGHT_X; }

  spawnPods(cfg, withHint = true){
    this.pods.forEach(p => p.destroy()); this.pods = [];
    if (this.bush){ this.bush.destroy(); this.bush = null; }

    let layout = cfg.layout.map(o => ({ ...o }));
    if (cfg.random){
      const idx = Math.random() < 0.5 ? 0 : 1;
      layout.forEach((o,i) => o.energy = (i === idx));
    }
    layout.forEach(o => {
      const pod = new EnergyPod({
        leftPct: this._x(o.side), topPct: cfg.byteTop,   // same path row → horizontal reach
        hasEnergy: o.energy, hint: withHint && cfg.hint && o.energy,
      });
      pod.side = o.side; this.pods.push(pod);
    });
    if (cfg.bush){
      const energy = layout.find(o => o.energy);
      this.bush = new Bush({ leftPct: (PATH_X + this._x(energy.side)) / 2, topPct: cfg.byteTop + 2 });
    }
  }

  beginLevel(){
    const cfg = this.levels[this.level];
    this.spawnPods(cfg, true);
    this.ui.showHint(cfg.hintText);
    this.pods.forEach(p => p.enableTap(pod => this.handlePodTap(pod)));
    this.canTap = true;
  }

  async handlePodTap(pod){
    if (this.busy || !this.canTap) return;
    this.busy = true; this.canTap = false;
    this.pods.forEach(p => p.disableTap());
    this.ui.hideHint();
    this.byte.leanTo(pod);
    await sleep(260);
    const bushInPath = (this.bush && pod.hasEnergy) ? this.bush : null;
    await this.byte.extendArm(pod.el, bushInPath);
    await sleep(120);
    if (pod.hasEnergy) await this.correctSequence(pod);
    else               await this.wrongSequence(pod);
  }

  async correctSequence(pod){
    pod.open();
    const podC = centerOf(pod.el);
    this.particles.emit('energy', podC.x, podC.y, 16);
    await sleep(260);

    playSound('coin');
    const coin = document.createElement('div');
    coin.className = 'coin'; coin.innerHTML = COIN_SVG;
    coin.style.left = podC.x + 'px'; coin.style.top = podC.y + 'px';
    effectLayer.appendChild(coin);

    await sleep(60);
    await this.byte.retractArm();
    const byteC = centerOf(this.byte.el);
    coin.style.transform = `translate(-50%,-50%) translate(${byteC.x - podC.x}px, ${byteC.y - podC.y}px)`;
    await sleep(720);

    playSound('charge');
    this.byte.startCharge();
    this.particles.emit('charge', byteC.x, byteC.y, 20);
    coin.style.opacity = '0'; coin.style.transform += ' scale(.2)';
    setTimeout(() => coin.remove(), 320);

    this.ui.setBattery(this.batterySteps[this.level]);
    this.byte.cheer();
    await sleep(700);
    this.byte.stopCharge(); this.byte.resetLean();

    await this.ui.bigMessage('Great! Byte found energy! ⚡', 1500);

    this.level++;
    if (this.level >= this.levels.length) await this.win();
    else await this.advanceLevel();
    this.busy = false;
  }

  async wrongSequence(pod){
    playSound('wrong');
    pod.open();
    await sleep(200);
    pod.shake();
    await pod.bunnyGag();
    await this.byte.retractArm();
    this.byte.resetLean();
    pod.reset();
    await sleep(200);
    this.ui.showHint(this.levels[this.level].hintText);
    this.pods.forEach(p => p.enableTap(pp => this.handlePodTap(pp)));
    this.canTap = true; this.busy = false;
  }

  async advanceLevel(){
    const cfg = this.levels[this.level];
    this.pods.forEach(p => { p.el.style.opacity='0';
      p.el.style.transform='translate(-50%,-30%) scale(.6)'; });
    if (this.bush){ this.bush.el.style.transition='opacity .4s ease'; this.bush.el.style.opacity='0'; }
    await sleep(420);
    await this.byte.hop(cfg.byteTop);        // one cell up the path
    this.ui.moveTile(cfg.byteTop);
    await sleep(150);
    this.beginLevel();
  }

  async win(){
    this.ui.hideInstruction();
    this.ui.setBattery(100);
    playSound('win');
    await this.ui.bigMessage('FULLY CHARGED! 🎉', 1400);
    this.particles.confetti();
    setTimeout(() => this.particles.confetti(), 700);
    $('#win').classList.add('show');
  }

  restart(){
    $('#win').classList.remove('show');
    this.pods.forEach(p => p.destroy()); this.pods = [];
    if (this.bush){ this.bush.destroy(); this.bush = null; }
    this.level = 0; this.busy = false; this.canTap = false;
    this.ui.setBattery(15, false);
    this.ui.hideHint();
    this.byte.setTopPercent(this.levels[0].byteTop);
    this.ui.moveTile(this.levels[0].byteTop);
    this.beginLevel();
  }
}

/* ============================================================
   Boot
   ============================================================ */
window.addEventListener('load', () => {
  audio.init();
  const game = new GameManager();
  const startScreen = $('#startScreen');

  // First tap unlocks the AudioContext (browser autoplay policy) AND kicks
  // off Byte's entrance — so every movement sound is audible from the start.
  const begin = () => {
    startScreen.removeEventListener('click', begin);
    audio.resume();
    audio.play('coin');                 // tiny confirmation blip
    startScreen.classList.add('hide');
    game.start();
  };
  startScreen.addEventListener('click', begin);
});
</script>
